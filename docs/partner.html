<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밀리플레이스 · 제휴처 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --paper: #FAF6EF;
    --paper-card: #FDFBF6;
    --ink: #2B2420;
    --ink-soft: #6b6055;
    --ink-faint: #a39a8c;
    --accent: #8B4A3C;
    --accent-soft: #f3e6e0;
    --sage: #6B7A5E;
    --sage-soft: #e9edE3;
    --border: #E8E0D2;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2, h3, .serif { font-family: 'Source Serif 4', Georgia, serif; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 18px 60px; }

  /* 헤더 */
  header.top {
    padding: 28px 18px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--paper);
    position: sticky; top: 0; z-index: 20;
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
  }
  header.top .inner { max-width: 760px; margin: 0 auto; }
  .brand-row { display: flex; align-items: baseline; gap: 10px; }
  .brand-mark {
    font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 22px;
    color: var(--accent); letter-spacing: -0.01em;
  }
  .brand-sub { font-size: 12.5px; color: var(--ink-faint); }
  .page-title {
    font-size: 26px; font-weight: 600; margin: 14px 0 4px; line-height: 1.3;
  }
  .page-desc { font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; margin: 0; }

  /* 탭 네비게이션 */
  .tab-nav {
    display: flex; gap: 4px; margin-top: 18px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .tab-nav button {
    flex: 1; min-width: 100px;
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    color: var(--ink-faint);
    padding: 10px 8px 12px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab-nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-panel { display: none; padding-top: 22px; }
  .tab-panel.active { display: block; }

  /* 카드 */
  .card {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 18px 18px 20px;
    margin-bottom: 16px;
  }
  .card.sage { border-left-color: var(--sage); }
  .card h2 {
    font-size: 16.5px; font-weight: 600; margin: 0 0 4px;
  }
  .card .card-note {
    font-size: 12px; color: var(--ink-faint); margin-bottom: 14px; line-height: 1.6;
  }

  /* KPI */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .kpi {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 12px 13px;
  }
  .kpi .label { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 6px; }
  .kpi .value { font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 600; }
  .kpi .value .unit { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--ink-faint); margin-left: 2px; }
  .kpi .sub { font-size: 11.5px; margin-top: 5px; }
  .up { color: var(--accent); font-weight: 600; }
  .down { color: var(--sage); font-weight: 600; }

  .chart-wrap { position: relative; height: 220px; margin-top: 6px; }
  .chart-wrap.tall { height: 260px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .two-col { grid-template-columns: 1fr; } }
  .kpi-delta {
    font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 20px; margin-left: 6px;
  }
  .kpi-delta.up { background: var(--accent-soft); color: var(--accent); }
  .kpi-delta.down { background: var(--sage-soft); color: var(--sage); }

  /* 검색/선택 */
  .store-search {
    width: 100%; padding: 13px 14px; font-size: 15px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--ink);
    margin-bottom: 10px;
  }
  .store-search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  datalist {}

  .placeholder {
    text-align: center; padding: 50px 20px; color: var(--ink-faint);
  }
  .placeholder .icon { font-size: 34px; margin-bottom: 10px; }
  .placeholder p { font-size: 13.5px; margin: 4px 0 0; }

  /* 배너 갤러리 */
  .banner-grid {
    display: grid; grid-template-columns: 1fr; gap: 14px;
  }
  .banner-item {
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: #fff;
  }
  .banner-item img { width: 100%; display: block; aspect-ratio: 16/10; object-fit: cover; background: #eee; }
  .banner-item .cap { padding: 12px 14px 14px; }
  .banner-item .cap .t { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
  .banner-item .cap .s { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .banner-item .cap .d { font-size: 11px; color: var(--ink-faint); margin-top: 6px; }

  .period-row { padding: 10px 0; border-top: 1px solid var(--border); }
  .period-row:first-child { border-top: none; }
  .period-row .range { font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--ink-soft); }
  .thumb-row { display: flex; gap: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .thumb { flex: 0 0 120px; }
  .thumb img { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; background: #eee; display: block; }
  .thumb .tt { font-size: 10.5px; font-weight: 600; margin-top: 4px; line-height: 1.3; }

  footer.page-footer {
    text-align: center; font-size: 11.5px; color: var(--ink-faint); padding: 28px 0 10px;
  }

  @media (max-width: 480px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .kpi { padding: 10px 8px 11px; }
    .kpi .value { font-size: 18px; }
    .page-title { font-size: 22px; }
    .card { padding: 15px 14px 17px; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1c1a17; --paper-card: #24211d; --ink: #ece6da; --ink-soft: #b3a999;
      --ink-faint: #74695b; --border: #3a352d; --accent-soft: #3a2925; --sage-soft: #232a1f;
    }
    .kpi { background: #221f1b; }
    .store-search, .banner-item { background: #221f1b; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <div class="brand-row">
      <span class="brand-mark">밀리플레이스</span>
      <span class="brand-sub">제휴처 안내</span>
    </div>
    <div class="page-title">함께해주셔서 감사합니다</div>
    <p class="page-desc">밀리플레이스 전체 방문 현황과 우리 매장의 데이터, 그리고 최근 마케팅 소식을 확인하실 수 있어요.</p>
    <nav class="tab-nav">
      <button data-tab="overview" class="active">방문자 현황</button>
      <button data-tab="mystore">내 매장 데이터</button>
      <button data-tab="marketing">마케팅 소식</button>
    </nav>
  </div>
</header>

<div class="wrap">

  <div class="tab-panel active" id="tab-overview">
    <div id="overview-area"></div>
  </div>

  <div class="tab-panel" id="tab-mystore">
    <div id="mystore-area"></div>
  </div>

  <div class="tab-panel" id="tab-marketing">
    <div id="marketing-area"></div>
  </div>

  <footer class="page-footer">밀리플레이스 · Millie Place</footer>
</div>

<script>
(function () {
  "use strict";

  let STATS = null;
  let BANNER_DATA = null;
  let BANNER_HISTORY = null;
  let PARTNER_TOKENS = {};
  let overviewChart = null;

  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    return Math.round(n).toLocaleString("ko-KR");
  }

  function toLocalDateStr(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function pctBadge(pct) {
    if (pct === null || pct === undefined || !isFinite(pct)) return `<span style="color:var(--ink-faint);">-</span>`;
    const up = pct >= 0;
    return `<span class="${up ? "up" : "down"}">${up ? "▲" : "▼"}${Math.abs(pct).toFixed(0)}%</span>`;
  }

  /* ---------- 탭 전환 ---------- */
  function setupTabs() {
    document.querySelectorAll(".tab-nav button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-nav button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });
  }

  /* ================= 탭 1: 전체 방문자 현황 ================= */
  function renderOverviewTab() {
    const area = document.getElementById("overview-area");
    const ov = STATS && STATS.overview;
    if (!ov || !ov.monthly || !ov.monthly.length) {
      area.innerHTML = `<div class="placeholder"><div class="icon">📊</div><h3>데이터 준비 중</h3><p>곧 방문자 현황을 보여드릴게요.</p></div>`;
      return;
    }
    const months = ov.monthly;
    const mtd = ov.mtd;
    const pct = mtd && mtd.prev > 0 ? (mtd.cur - mtd.prev) / mtd.prev * 100 : null;
    const weekPct = ov.prev7 > 0 ? (ov.last7 - ov.prev7) / ov.prev7 * 100 : null;
    area.innerHTML = `
      <div class="card">
        <h2>밀리플레이스 전체 방문자수</h2>
        <div class="card-note">앱 내 밀리플레이스 페이지 전체 방문(UV) 기준 · ${ov.latest_date || ""}까지</div>
        <div class="kpi-grid">
          <div class="kpi"><div class="label">이번 달 (1~${mtd ? mtd.days : "-"}일)</div><div class="value">${fmt(mtd ? mtd.cur : 0)}<span class="unit">명</span></div>
            <div class="sub">전월 같은 기간 대비 ${pctBadge(pct)}</div></div>
          <div class="kpi"><div class="label">최근 7일</div><div class="value">${fmt(ov.last7)}<span class="unit">명</span></div>
            <div class="sub">직전 7일 대비 ${pctBadge(weekPct)}</div></div>
          <div class="kpi"><div class="label">함께하는 공간</div><div class="value">${fmt(ov.active_partners)}<span class="unit">곳</span></div>
            <div class="sub" style="color:var(--ink-faint);">${(ov.regions || []).length}개 시·도</div></div>
        </div>
      </div>
      <div class="card sage">
        <h2>월별 방문자 추이</h2>
        <div class="card-note">최근 12개월</div>
        <div class="chart-wrap tall"><canvas id="overviewChart"></canvas></div>
      </div>`;
    const shown = months.slice(-12);
    if (overviewChart) { overviewChart.destroy(); overviewChart = null; }
    overviewChart = new Chart(document.getElementById("overviewChart"), {
      type: "line",
      data: { labels: shown.map(m => m.month.slice(2)), datasets: [{ data: shown.map(m => m.uv), borderColor: "#8B4A3C", backgroundColor: "rgba(139,74,60,0.08)", fill: true, tension: 0.35, pointRadius: 3, pointBackgroundColor: "#8B4A3C", borderWidth: 2.4 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { grid: { display: false }, ticks: { color: "#a39a8c", font: { size: 11 } } }, y: { grid: { color: "#E8E0D2" }, ticks: { color: "#a39a8c", font: { size: 11 } } } } },
    });
  }

  /* ================= 탭 2: 내 매장 데이터 (순위·비율 중심) ================= */
  let storeCharts = {};
  function destroyStoreCharts() { Object.values(storeCharts).forEach(c => c && c.destroy()); storeCharts = {}; }
  const AGE_LABEL = { "10": "10대", "20": "20대", "30": "30대", "40": "40대", "50": "50대", "60": "60대+" };

  function monthsSince(dateStr) {
    if (!dateStr) return null;
    const a = new Date(dateStr + "T00:00:00"), b = new Date();
    return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  }

  function renderStoreResult(name, e) {
    const resultArea = document.getElementById("mystore-result");
    destroyStoreCharts();
    const r = e.rank || {};
    const rankItems = [];
    const add = (x, label) => { if (x) rankItems.push({ label, ...x }); };
    add(r.area, r.area ? r.area.group : "");
    add(r.sido, r.sido ? `${r.sido.group} 지역` : "");
    add(r.size, r.size ? `${r.size.group} 매장` : "");
    add(r.overall, "밀리플레이스 전체");
    const highlights = rankItems.slice().sort((a, b) => a.rank / a.total - b.rank / b.total);
    const changeBadge = x => {
      if (x.prev_rank === null || x.prev_rank === undefined) return `<span class="kpi-delta" style="background:#f1efe9; color:var(--ink-faint);">NEW</span>`;
      const d = x.prev_rank - x.rank;
      if (d > 0) return `<span class="kpi-delta up">▲${d}</span>`;
      if (d < 0) return `<span class="kpi-delta down">▼${-d}</span>`;
      return `<span class="kpi-delta" style="background:#f1efe9; color:var(--ink-faint);">유지</span>`;
    };

    const m = monthsSince(e.since);
    const sinceText = e.since ? (m >= 1 ? `${m}개월째 함께하고 있어요` : `이번 달부터 함께하고 있어요`) : "";
    const region = e.area || [e.sido, e.gugun].filter(Boolean).join(" ");

    // 요약 문장
    const lines = [];
    if (highlights.length) {
      const h = highlights[0];
      const d = (h.prev_rank !== null && h.prev_rank !== undefined) ? h.prev_rank - h.rank : null;
      lines.push(`<b>${h.label}</b> ${h.total}곳 중 방문자 <b>${h.rank}위</b>예요${d > 0 ? ` (지난달보다 <span class="up">${d}계단 상승</span>)` : ""}`);
    }
    if (e.trend30_pct !== null && e.trend30_pct !== undefined && e.trend30_pct >= 10) {
      lines.push(`최근 30일 방문이 직전 30일보다 <b class="up">${e.trend30_pct}% 늘었어요</b>`);
    }
    if (e.weekday_share) {
      const top = Object.entries(e.weekday_share).sort((a, b) => b[1] - a[1])[0];
      lines.push(`<b>${top[0]}요일</b>에 가장 많이 찾아와요`);
    }
    const demoAll = STATS.demo_all;
    if (e.demo && demoAll) {
      const topAge = Object.entries(e.demo.age).sort((a, b) => b[1] - a[1])[0];
      lines.push(`주 방문객은 <b>${AGE_LABEL[topAge[0]]}</b>(${topAge[1].toFixed(0)}%)이에요`);
    }

    const rankCards = rankItems.length ? rankItems.map(h => `
      <div class="kpi">
        <div class="label">${h.label}</div>
        <div class="value">${h.rank}<span class="unit">위</span></div>
        <div class="sub" style="color:var(--ink-faint);">${h.total}곳 중 ${changeBadge(h)}</div>
      </div>`).join("") : "";

    const wd = e.weekday_share;
    const wdMax = wd ? Math.max(...Object.values(wd)) : 0;

    let demoHtml = "";
    if (e.demo && demoAll) {
      const ages = Object.keys(AGE_LABEL).filter(a => (e.demo.age[a] || 0) > 0 || (demoAll.age[a] || 0) > 1);
      const diffs = ages.map(a => ({ a, d: (e.demo.age[a] || 0) - (demoAll.age[a] || 0) })).sort((x, y) => y.d - x.d);
      const standout = diffs[0] && diffs[0].d >= 5 ? diffs[0] : null;
      const fDiff = e.demo.female - demoAll.female;
      const notes = [];
      if (standout) notes.push(`밀리플레이스 평균보다 <b>${AGE_LABEL[standout.a]}</b> 비중이 ${standout.d.toFixed(0)}%p 높아요`);
      if (Math.abs(fDiff) >= 5) notes.push(`여성 방문객 비중이 평균보다 ${Math.abs(fDiff).toFixed(0)}%p ${fDiff > 0 ? "높아요" : "낮아요"} (${e.demo.female.toFixed(0)}%)`);
      else notes.push(`성별 구성은 밀리플레이스 평균과 비슷해요 (여성 ${e.demo.female.toFixed(0)}%)`);
      demoHtml = `
      <div class="card">
        <h2>우리 매장 방문객은 이런 분들이에요</h2>
        <div class="card-note">${STATS.demo_month} 기준 · 밀리 회원 정보 기반</div>
        <ul style="margin:0 0 14px; padding-left:18px; font-size:13.5px; line-height:1.9;">${notes.map(t => `<li>${t}</li>`).join("")}</ul>
        <div class="chart-wrap"><canvas id="storeDemoChart"></canvas></div>
      </div>`;
      storeCharts._demoAges = ages;
    } else {
      demoHtml = `<div class="card"><h2>방문객 특징</h2><div class="card-note">방문객 정보가 충분히 쌓이면 연령·성별 특징을 보여드릴게요</div></div>`;
    }

    // 방문 흐름 (평소=100 지수, 7일 이동평균, 밀리플레이스 전체 비교)
    let flowHtml = "";
    const flow = e.flow, flowAll = STATS.flow_all, flowDates = STATS.flow_dates || [];
    if (flow && flow.some(v => v !== null)) {
      const recentAvg = arr => { const v = (arr || []).slice(-14).filter(x => x !== null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
      const mine = recentAvg(flow), all = recentAvg(flowAll);
      const chips = [];
      if (mine !== null) chips.push(`최근 2주 평소 대비 <b class="${mine >= 100 ? "up" : "down"}">${mine >= 100 ? "+" : ""}${Math.round(mine - 100)}%</b>`);
      if (mine !== null && all !== null) {
        const gap = mine - all;
        chips.push(Math.abs(gap) < 5 ? `밀리플레이스 전체 흐름과 <b>비슷해요</b>` : gap > 0 ? `밀리플레이스 전체 흐름보다 <b class="up">좋아요</b>` : `밀리플레이스 전체 흐름보다 <b class="down">주춤해요</b>`);
      }
      flowHtml = `<div class="card sage">
        <h2>방문 흐름</h2>
        <div class="card-note">최근 90일 · 7일 이동평균 · 기간 평균을 100(평소)으로 둔 지수예요${(e.featured || []).length ? " · 음영은 메인 배너 노출 기간" : ""}</div>
        ${chips.length ? `<div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;">${chips.map(c => `<span style="font-size:12.5px; background:#fff; border:1px solid var(--border); border-radius:20px; padding:5px 11px;">${c}</span>`).join("")}</div>` : ""}
        <div class="chart-wrap tall"><canvas id="storeFlowChart"></canvas></div>
      </div>`;
    }

    const featuredHtml = (e.featured && e.featured.length) ? `
      <div class="card sage">
        <h2>밀리플레이스 메인에 소개됐어요</h2>
        ${e.featured.map(f => `<div style="font-size:13.5px; padding:6px 0; border-top:1px solid var(--border);">
          <b>${f.title}</b><div style="font-size:12px; color:var(--ink-faint); margin-top:2px;">${f.start}${f.start !== f.end ? " ~ " + f.end : ""}</div></div>`).join("")}
      </div>` : "";

    resultArea.innerHTML = `
      <div class="card">
        <h2>${name}</h2>
        <div class="card-note">${[region, e.size ? e.size + " 매장" : "", sinceText].filter(Boolean).join(" · ")}${e.tier ? ` <span class="kpi-delta up" style="margin-left:4px;">${e.tier}</span>` : ""}</div>
        ${lines.length ? `<ul style="margin:0; padding-left:18px; font-size:14px; line-height:1.95;">${lines.map(t => `<li>${t}</li>`).join("")}</ul>`
          : `<p style="font-size:13.5px; color:var(--ink-soft); margin:0;">방문 데이터가 쌓이는 중이에요. 조금만 기다려주세요!</p>`}
      </div>

      ${rankCards ? `<div class="card">
        <h2>방문자 순위</h2>
        <div class="card-note">최근 ${STATS.window.days}일 기준 (${STATS.window.start} ~ ${STATS.window.end}) · 괄호 안은 직전 30일 대비 순위 변화 · 신규 매장은 노출 이후 일평균으로 비교해요</div>
        <div class="kpi-grid" style="grid-template-columns: repeat(${Math.min(rankItems.length, 4)}, 1fr);">${rankCards}</div>
      </div>` : ""}

      ${flowHtml}

      ${wd ? `<div class="card">
        <h2>요일별 방문 패턴</h2>
        <div class="card-note">최근 90일 · 요일별 방문 비중</div>
        ${Object.entries(wd).map(([k, v]) => `
          <div style="display:flex; align-items:center; gap:10px; margin:6px 0; font-size:13px;">
            <div style="width:22px; font-weight:600; ${v === wdMax ? "color:var(--accent);" : ""}">${k}</div>
            <div style="flex:1; background:#efe8dc; border-radius:4px; height:12px; overflow:hidden;">
              <div style="width:${wdMax ? (v / wdMax * 100) : 0}%; height:100%; background:${v === wdMax ? "var(--accent)" : "#c9b8a4"};"></div>
            </div>
            <div style="width:44px; text-align:right; color:var(--ink-soft);">${v.toFixed(0)}%</div>
          </div>`).join("")}
      </div>` : ""}

      ${demoHtml}
      ${featuredHtml}`;

    if (flowHtml && document.getElementById("storeFlowChart")) {
      const lastI = flowDates.length - 1;
      const idx = d => d <= flowDates[0] ? 0 : d >= flowDates[lastI] ? lastI : flowDates.indexOf(d);
      const bands = (e.featured || []).filter(f => f.end >= flowDates[0] && f.start <= flowDates[lastI]).map(f => [idx(f.start), idx(f.end)]).filter(([a, b]) => a >= 0 && b >= a);
      const guidePlugin = {
        id: "flowGuides",
        beforeDatasetsDraw(chart) {
          const { ctx, chartArea: { left, right, top, bottom }, scales: { x, y } } = chart;
          ctx.save();
          bands.forEach(([a, b]) => {
            const x0 = x.getPixelForValue(a), x1 = x.getPixelForValue(b);
            ctx.fillStyle = "rgba(139,74,60,0.07)"; ctx.fillRect(x0, top, Math.max(x1 - x0, 3), bottom - top);
          });
          const y100 = y.getPixelForValue(100);
          if (y100 >= top && y100 <= bottom) {
            ctx.setLineDash([4, 4]); ctx.strokeStyle = "#b9ab97"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(left, y100); ctx.lineTo(right, y100); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = "#a39a8c"; ctx.font = "11px Inter, sans-serif"; ctx.textAlign = "right"; ctx.fillText("평소", right - 2, y100 - 4);
          }
          ctx.restore();
        },
      };
      const vals = flow.concat(flowAll || []).filter(v => v !== null);
      const ctx2 = document.getElementById("storeFlowChart").getContext("2d");
      let grad = "rgba(139,74,60,0.12)";
      if (ctx2 && ctx2.createLinearGradient) {
        grad = ctx2.createLinearGradient(0, 0, 0, 260);
        grad.addColorStop(0, "rgba(139,74,60,0.28)"); grad.addColorStop(1, "rgba(139,74,60,0.01)");
      }
      storeCharts.flow = new Chart(document.getElementById("storeFlowChart"), {
        type: "line",
        data: {
          labels: flowDates.map(d => d.slice(5)),
          datasets: [
            { label: "우리 매장", data: flow, borderColor: "#8B4A3C", backgroundColor: grad, fill: true, tension: 0.4, pointRadius: 0, pointHoverRadius: 4, borderWidth: 2.4, spanGaps: false },
            { label: "밀리플레이스 전체", data: flowAll || [], borderColor: "#9aa58e", borderDash: [5, 4], fill: false, tension: 0.4, pointRadius: 0, borderWidth: 1.6 },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { position: "bottom", labels: { boxWidth: 14, boxHeight: 2, font: { size: 11 }, color: "#6b6055" } },
            tooltip: { callbacks: { label: c => c.parsed.y === null ? "" : `${c.dataset.label}: 평소 대비 ${c.parsed.y >= 100 ? "+" : ""}${c.parsed.y - 100}%` } },
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: "#a39a8c", font: { size: 10 }, maxTicksLimit: 7, maxRotation: 0 } },
            y: { suggestedMin: Math.max(0, Math.min(...vals, 60) - 10), suggestedMax: Math.max(...vals, 140) + 10, grid: { color: "#efe8dc" },
                 ticks: { color: "#a39a8c", font: { size: 10 }, maxTicksLimit: 5, callback: v => (v === 100 ? "평소" : (v > 100 ? "+" : "") + (v - 100) + "%") } },
          },
        },
        plugins: [guidePlugin],
      });
    }
    if (storeCharts._demoAges && document.getElementById("storeDemoChart")) {
      const ages = storeCharts._demoAges; delete storeCharts._demoAges;
      storeCharts.demo = new Chart(document.getElementById("storeDemoChart"), {
        type: "bar",
        data: { labels: ages.map(a => AGE_LABEL[a]), datasets: [
          { label: "우리 매장", data: ages.map(a => e.demo.age[a] || 0), backgroundColor: "#8B4A3C", borderRadius: 4, maxBarThickness: 26 },
          { label: "밀리플레이스 평균", data: ages.map(a => demoAll.age[a] || 0), backgroundColor: "#d8cbb9", borderRadius: 4, maxBarThickness: 26 },
        ] },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } }, tooltip: { callbacks: { label: c => `${c.dataset.label} ${c.parsed.y.toFixed(1)}%` } } },
          scales: { x: { grid: { display: false }, ticks: { color: "#a39a8c", font: { size: 11 } } }, y: { grid: { color: "#E8E0D2" }, ticks: { color: "#a39a8c", font: { size: 10 }, callback: v => v + "%" } } } },
      });
    }
  }

  function renderMystoreTab() {
    const area = document.getElementById("mystore-area");
    const token = new URLSearchParams(window.location.search).get("t");
    const name = token ? PARTNER_TOKENS[token] : null;
    const entry = name && STATS && STATS.stores ? STATS.stores[name] : null;
    if (!name) {
      area.innerHTML = `
        <div class="card">
          <h2>우리 매장 데이터 조회</h2>
          <div class="card-note">이 화면은 매장별 개인 링크로만 확인하실 수 있어요</div>
          <div class="placeholder" style="padding:30px 10px;"><div class="icon">🔒</div><h3>개인 링크가 필요해요</h3><p>담당 매니저가 안내해드린 링크로 접속해주세요.</p></div>
        </div>`;
      return;
    }
    if (!entry || !entry.rank) {
      area.innerHTML = `<div class="card"><h2>${name}</h2><div class="placeholder" style="padding:30px 10px;"><div class="icon">🌱</div><h3>데이터를 준비하고 있어요</h3><p>앱에 노출된 뒤 방문 데이터가 쌓이면 보여드릴게요.</p></div></div>`;
      return;
    }
    area.innerHTML = `<div id="mystore-result"></div>`;
    renderStoreResult(name, entry);
  }

  /* ================= 탭 3: 마케팅 소식 ================= */
  function buildBannerPeriods(history) {
    if (!history || !history.days) return [];
    const dates = Object.keys(history.days).sort();
    if (!dates.length) return [];
    const meta = history.meta || {};
    const periods = [];
    let cur = null;
    dates.forEach(date => {
      const images = history.days[date].images || [];
      const signature = images.slice().sort().join("|");
      if (cur && cur.signature === signature) {
        cur.end = date;
      } else {
        if (cur) periods.push(cur);
        cur = { start: date, end: date, signature, images };
      }
    });
    if (cur) periods.push(cur);
    return periods.reverse().map(p => ({
      start: p.start, end: p.end,
      slides: p.images.map(img => ({
        image: img,
        title: (meta[img] && meta[img].title) || "",
        subtitle: (meta[img] && meta[img].subtitle) || "",
      })),
    }));
  }

  function renderMarketingTab() {
    const area = document.getElementById("marketing-area");
    const current = BANNER_DATA && BANNER_DATA.slides && BANNER_DATA.slides.length ? BANNER_DATA : null;
    const periods = buildBannerPeriods(BANNER_HISTORY).slice(0, 8);

    if (!current && !periods.length) {
      area.innerHTML = `<div class="placeholder"><div class="icon">📰</div><h3>소식 준비 중</h3><p>곧 마케팅 소식을 보여드릴게요.</p></div>`;
      return;
    }

    const currentHtml = current ? `
      <div class="card">
        <h2>지금 밀리플레이스 메인에 소개되고 있어요</h2>
        <div class="card-note">${current.captured_at ? current.captured_at.slice(0, 10) + " 기준" : ""}</div>
        <div class="banner-grid">
          ${current.slides.map(s => `
            <div class="banner-item">
              <img src="${s.image}" alt="${s.title}" loading="lazy">
              <div class="cap">
                <div class="t">${s.title}</div>
                <div class="s">${s.subtitle}</div>
              </div>
            </div>`).join("")}
        </div>
      </div>` : "";

    const historyHtml = periods.length ? `
      <div class="card sage">
        <h2>메인 배너 소개 이력</h2>
        <div class="card-note">최근 소개된 순서예요</div>
        ${periods.map(p => `
          <div class="period-row">
            <div class="range">${p.start}${p.start !== p.end ? " ~ " + p.end : ""}</div>
            <div class="thumb-row">
              ${p.slides.map(s => `
                <div class="thumb">
                  <img src="${s.image}" alt="${s.title}" loading="lazy">
                  <div class="tt">${s.title}</div>
                </div>`).join("")}
            </div>
          </div>`).join("")}
      </div>` : "";

    area.innerHTML = currentHtml + historyHtml;
  }

  /* ================= 로드 ================= */
  async function load() {
    setupTabs();
    try {
      const res = await fetch("./partner_stats.json", { cache: "no-store" });
      if (res.ok) STATS = await res.json();
    } catch (e) { /* noop */ }

    try {
      const r1 = await fetch("./millieplace_banner.json", { cache: "no-store" });
      if (r1.ok) BANNER_DATA = await r1.json();
    } catch (e) { BANNER_DATA = null; }

    try {
      const r2 = await fetch("./millieplace_banner_history.json", { cache: "no-store" });
      if (r2.ok) BANNER_HISTORY = await r2.json();
    } catch (e) { BANNER_HISTORY = null; }

    try {
      const r3 = await fetch("./partner_tokens.json", { cache: "no-store" });
      if (r3.ok) PARTNER_TOKENS = await r3.json();
    } catch (e) { PARTNER_TOKENS = {}; }

    renderOverviewTab();
    renderMystoreTab();
    renderMarketingTab();
  }

  load();
})();
</script>
</body>
</html>
