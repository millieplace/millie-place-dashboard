<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밀리플레이스 · 제휴처 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --paper: #FAF6EF;
    --paper-card: #FDFBF6;
    --ink: #2B2420;
    --ink-soft: #6b6055;
    --ink-faint: #a39a8c;
    --accent: #8B4A3C;
    --accent-soft: #f3e6e0;
    --sage: #6B7A5E;
    --sage-soft: #e9edE3;
    --border: #E8E0D2;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2, h3, .serif { font-family: 'Source Serif 4', Georgia, serif; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 18px 60px; }

  /* 헤더 */
  header.top {
    padding: 28px 18px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--paper);
    position: sticky; top: 0; z-index: 20;
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
  }
  header.top .inner { max-width: 760px; margin: 0 auto; }
  .brand-row { display: flex; align-items: baseline; gap: 10px; }
  .brand-mark {
    font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 22px;
    color: var(--accent); letter-spacing: -0.01em;
  }
  .brand-sub { font-size: 12.5px; color: var(--ink-faint); }
  .page-title {
    font-size: 26px; font-weight: 600; margin: 14px 0 4px; line-height: 1.3;
  }
  .page-desc { font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; margin: 0; }

  /* 탭 네비게이션 */
  .tab-nav {
    display: flex; gap: 4px; margin-top: 18px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .tab-nav button {
    flex: 1; min-width: 100px;
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    color: var(--ink-faint);
    padding: 10px 8px 12px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab-nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-panel { display: none; padding-top: 22px; }
  .tab-panel.active { display: block; }

  /* 카드 */
  .card {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 18px 18px 20px;
    margin-bottom: 16px;
  }
  .card.sage { border-left-color: var(--sage); }
  .card h2 {
    font-size: 16.5px; font-weight: 600; margin: 0 0 4px;
  }
  .card .card-note {
    font-size: 12px; color: var(--ink-faint); margin-bottom: 14px; line-height: 1.6;
  }

  /* KPI */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .kpi {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 12px 13px;
  }
  .kpi .label { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 6px; }
  .kpi .value { font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 600; }
  .kpi .value .unit { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--ink-faint); margin-left: 2px; }
  .kpi .sub { font-size: 11.5px; margin-top: 5px; }
  .up { color: var(--accent); font-weight: 600; }
  .down { color: var(--sage); font-weight: 600; }

  .chart-wrap { position: relative; height: 220px; margin-top: 6px; }
  .chart-wrap.tall { height: 260px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .two-col { grid-template-columns: 1fr; } }
  .kpi-delta {
    font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 20px; margin-left: 6px;
  }
  .kpi-delta.up { background: var(--accent-soft); color: var(--accent); }
  .kpi-delta.down { background: var(--sage-soft); color: var(--sage); }

  /* 검색/선택 */
  .store-search {
    width: 100%; padding: 13px 14px; font-size: 15px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--ink);
    margin-bottom: 10px;
  }
  .store-search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  datalist {}

  .placeholder {
    text-align: center; padding: 50px 20px; color: var(--ink-faint);
  }
  .placeholder .icon { font-size: 34px; margin-bottom: 10px; }
  .placeholder p { font-size: 13.5px; margin: 4px 0 0; }

  /* 배너 갤러리 */
  .banner-grid {
    display: grid; grid-template-columns: 1fr; gap: 14px;
  }
  .banner-item {
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: #fff;
  }
  .banner-item img { width: 100%; display: block; aspect-ratio: 16/10; object-fit: cover; background: #eee; }
  .banner-item .cap { padding: 12px 14px 14px; }
  .banner-item .cap .t { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
  .banner-item .cap .s { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .banner-item .cap .d { font-size: 11px; color: var(--ink-faint); margin-top: 6px; }

  .period-row { padding: 10px 0; border-top: 1px solid var(--border); }
  .period-row:first-child { border-top: none; }
  .period-row .range { font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--ink-soft); }
  .thumb-row { display: flex; gap: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .thumb { flex: 0 0 120px; }
  .thumb img { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; background: #eee; display: block; }
  .thumb .tt { font-size: 10.5px; font-weight: 600; margin-top: 4px; line-height: 1.3; }

  footer.page-footer {
    text-align: center; font-size: 11.5px; color: var(--ink-faint); padding: 28px 0 10px;
  }

  @media (max-width: 480px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .kpi { padding: 10px 8px 11px; }
    .kpi .value { font-size: 18px; }
    .page-title { font-size: 22px; }
    .card { padding: 15px 14px 17px; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1c1a17; --paper-card: #24211d; --ink: #ece6da; --ink-soft: #b3a999;
      --ink-faint: #74695b; --border: #3a352d; --accent-soft: #3a2925; --sage-soft: #232a1f;
    }
    .kpi { background: #221f1b; }
    .store-search, .banner-item { background: #221f1b; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <div class="brand-row">
      <span class="brand-mark">밀리플레이스</span>
      <span class="brand-sub">제휴처 안내</span>
    </div>
    <div class="page-title">함께해주셔서 감사합니다</div>
    <p class="page-desc">밀리플레이스 전체 방문 현황과 우리 매장의 데이터, 그리고 최근 마케팅 소식을 확인하실 수 있어요.</p>
    <nav class="tab-nav">
      <button data-tab="overview" class="active">방문자 현황</button>
      <button data-tab="mystore">내 매장 데이터</button>
      <button data-tab="marketing">마케팅 소식</button>
    </nav>
  </div>
</header>

<div class="wrap">

  <div class="tab-panel active" id="tab-overview">
    <div id="overview-area"></div>
  </div>

  <div class="tab-panel" id="tab-mystore">
    <div id="mystore-area"></div>
  </div>

  <div class="tab-panel" id="tab-marketing">
    <div id="marketing-area"></div>
  </div>

  <footer class="page-footer">밀리플레이스 · Millie Place</footer>
</div>

<script>
(function () {
  "use strict";

  let METRICS = {};
  let BANNER_DATA = null;
  let BANNER_HISTORY = null;
  let PARTNER_TOKENS = {};
  let overviewChart = null;

  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    return Math.round(n).toLocaleString("ko-KR");
  }

  function toLocalDateStr(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function pctBadge(pct) {
    if (pct === null || pct === undefined || !isFinite(pct)) return `<span style="color:var(--ink-faint);">-</span>`;
    const up = pct >= 0;
    return `<span class="${up ? "up" : "down"}">${up ? "▲" : "▼"}${Math.abs(pct).toFixed(0)}%</span>`;
  }

  /* ---------- 탭 전환 ---------- */
  function setupTabs() {
    document.querySelectorAll(".tab-nav button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-nav button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });
  }

  /* ================= 탭 1: 전체 방문자 현황 ================= */
  function aggregateMonthlyFromSeries(series) {
    const byMonth = {};
    (series || []).forEach(p => {
      const mk = p.date.slice(0, 7);
      byMonth[mk] = (byMonth[mk] || 0) + p.value;
    });
    return byMonth;
  }

  function renderOverviewTab() {
    const area = document.getElementById("overview-area");
    const uvMetric = METRICS.uv;
    if (!uvMetric || !uvMetric.series || !uvMetric.series.length) {
      area.innerHTML = `<div class="placeholder"><div class="icon">📊</div><h3>데이터 준비 중</h3><p>곧 방문자 현황을 보여드릴게요.</p></div>`;
      return;
    }
    const series = uvMetric.series;
    const monthly = aggregateMonthlyFromSeries(series);
    const monthKeys = Object.keys(monthly).sort();
    const latestMonth = monthKeys[monthKeys.length - 1];
    const prevMonth = monthKeys[monthKeys.length - 2];
    const curVal = monthly[latestMonth] || 0;
    const prevVal = prevMonth ? (monthly[prevMonth] || 0) : null;
    const pct = (prevVal && prevVal > 0) ? ((curVal - prevVal) / prevVal) * 100 : null;

    const last7 = series.slice(-7).reduce((a, p) => a + p.value, 0);
    const prev7 = series.slice(-14, -7).reduce((a, p) => a + p.value, 0);
    const week_pct = prev7 > 0 ? ((last7 - prev7) / prev7) * 100 : null;

    const totalAllTime = series.reduce((a, p) => a + p.value, 0);

    area.innerHTML = `
      <div class="card">
        <h2>밀리플레이스 전체 방문자수</h2>
        <div class="card-note">앱 내 밀리플레이스 페이지 전체 방문(UV) 기준이에요</div>
        <div class="kpi-grid">
          <div class="kpi">
            <div class="label">${latestMonth} 누적</div>
            <div class="value">${fmt(curVal)}<span class="unit">명</span></div>
            <div class="sub">${prevVal !== null ? `전월 대비 ${pctBadge(pct)}` : ""}</div>
          </div>
          <div class="kpi">
            <div class="label">최근 7일</div>
            <div class="value">${fmt(last7)}<span class="unit">명</span></div>
            <div class="sub">직전 7일 대비 ${pctBadge(week_pct)}</div>
          </div>
          <div class="kpi">
            <div class="label">누적 (전체 기간)</div>
            <div class="value">${fmt(totalAllTime)}<span class="unit">명</span></div>
            <div class="sub" style="color:var(--ink-faint);">서비스 시작 이후</div>
          </div>
        </div>
      </div>

      <div class="card sage">
        <h2>월별 방문자 추이</h2>
        <div class="card-note">최근 12개월</div>
        <div class="chart-wrap tall"><canvas id="overviewChart"></canvas></div>
      </div>`;

    const shownMonths = monthKeys.slice(-12);
    if (overviewChart) { overviewChart.destroy(); overviewChart = null; }
    overviewChart = new Chart(document.getElementById("overviewChart"), {
      type: "line",
      data: {
        labels: shownMonths.map(m => m.slice(2)),
        datasets: [{
          data: shownMonths.map(m => monthly[m]),
          borderColor: "#8B4A3C",
          backgroundColor: "rgba(139,74,60,0.08)",
          fill: true,
          tension: 0.35,
          pointRadius: 3,
          pointBackgroundColor: "#8B4A3C",
          borderWidth: 2.4,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#a39a8c", font: { size: 11 } } },
          y: { grid: { color: "#E8E0D2" }, ticks: { color: "#a39a8c", font: { size: 11 } } },
        },
      },
    });
  }

  /* ================= 탭 2: 내 매장 데이터 ================= */
  function buildStoreNameList() {
    const names = new Set();
    ["daily_store", "daily_store_uv", "daily_store_staff"].forEach(key => {
      const m = METRICS[key];
      if (!m || !m.daily_totals) return;
      Object.values(m.daily_totals).forEach(bucket => {
        Object.keys(bucket).forEach(n => { if (n && n !== "null") names.add(n); });
      });
    });
    return Array.from(names).sort((a, b) => a.localeCompare(b, "ko"));
  }

  function sumRecent(dailyTotals, name, days) {
    if (!dailyTotals) return 0;
    const dates = Object.keys(dailyTotals).sort();
    const recent = dates.slice(-days);
    return recent.reduce((a, d) => a + ((dailyTotals[d] || {})[name] || 0), 0);
  }

  function getSortedDates(dailyTotals) { return Object.keys(dailyTotals || {}).sort(); }
  function getSortedMonths(monthlyTotals) { return Object.keys(monthlyTotals || {}).sort(); }
  function getMonthKeyFromDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }

  function aggregateDailyStoreForMonth(dailyTotals, monthKey) {
    const totals = {};
    Object.keys(dailyTotals || {}).forEach(date => {
      if (date.startsWith(monthKey)) {
        Object.entries(dailyTotals[date]).forEach(([name, v]) => { totals[name] = (totals[name] || 0) + v; });
      }
    });
    return totals;
  }

  function getAugmentedMonthlyTotals(monthlyTotals, dailyTotals) {
    const months = getSortedMonths(monthlyTotals);
    const curMonthKey = getMonthKeyFromDate(new Date());
    if (months.includes(curMonthKey)) return monthlyTotals;
    if (dailyTotals && Object.keys(dailyTotals).some(d => d.startsWith(curMonthKey))) {
      return { ...monthlyTotals, [curMonthKey]: aggregateDailyStoreForMonth(dailyTotals, curMonthKey) };
    }
    return monthlyTotals;
  }

  function getCurPrevMonthStoreData(monthlyTotals, dailyTotals) {
    const months = getSortedMonths(monthlyTotals);
    const today = new Date();
    const curMonthKey = getMonthKeyFromDate(today);
    const dayOfMonth = today.getDate();
    const curMonthHasDailyData = dailyTotals && Object.keys(dailyTotals).some(d => d.startsWith(curMonthKey));
    let cur, prev, curLabel, prevLabel;

    if (months.includes(curMonthKey)) {
      const idx = months.indexOf(curMonthKey);
      curLabel = curMonthKey; cur = monthlyTotals[curMonthKey];
      prevLabel = idx > 0 ? months[idx - 1] : null;
      prev = prevLabel ? monthlyTotals[prevLabel] : {};
    } else if (curMonthHasDailyData && dayOfMonth >= 5) {
      curLabel = curMonthKey; cur = aggregateDailyStoreForMonth(dailyTotals, curMonthKey);
      prevLabel = months.length ? months[months.length - 1] : null;
      prev = prevLabel ? monthlyTotals[prevLabel] : {};
    } else if (months.length >= 2) {
      prevLabel = months[months.length - 2]; curLabel = months[months.length - 1];
      prev = monthlyTotals[prevLabel]; cur = monthlyTotals[curLabel];
    } else if (curMonthHasDailyData) {
      curLabel = curMonthKey; cur = aggregateDailyStoreForMonth(dailyTotals, curMonthKey);
      prevLabel = months.length ? months[months.length - 1] : null;
      prev = prevLabel ? monthlyTotals[prevLabel] : {};
    } else if (months.length === 1) {
      curLabel = months[0]; cur = monthlyTotals[curLabel]; prevLabel = null; prev = {};
    } else {
      return null;
    }
    return { curLabel, prevLabel, cur: cur || {}, prev: prev || {} };
  }

  function getStoreDailySeries(dailyTotals, name) {
    return getSortedDates(dailyTotals).map(d => ({ date: d, value: (dailyTotals[d] || {})[name] || 0 }));
  }
  function getStoreMonthlySeries(monthlyTotals, name) {
    return getSortedMonths(monthlyTotals).map(m => ({ month: m, value: (monthlyTotals[m] || {})[name] || 0 }));
  }
  function getStoreMonthlyRankSeries(monthlyTotals, name) {
    return getSortedMonths(monthlyTotals).map(m => {
      const bucket = monthlyTotals[m] || {};
      const sorted = Object.entries(bucket).sort((a, b) => b[1] - a[1]);
      const idx = sorted.findIndex(([n]) => n === name);
      return { month: m, rank: idx >= 0 ? idx + 1 : null, total: sorted.length };
    });
  }

  function demoSexLabel(s) { return s === "F" ? "여성" : s === "M" ? "남성" : (s || "-"); }
  function demoAgeLabel(age) { return age === "영유아" ? "영유아" : `${age}대`; }
  function demoGroupLabel(key) { const [sex, age] = key.split("_"); return `${demoAgeLabel(age)} ${demoSexLabel(sex)}`; }
  function aggregateDemoByGroup(rows, metricKey) {
    const groups = {};
    (rows || []).forEach(r => { const key = `${r.sex}_${r.age_band}`; groups[key] = (groups[key] || 0) + (Number(r[metricKey]) || 0); });
    return groups;
  }
  function demoSexShare(groups) {
    const total = Object.values(groups).reduce((a, v) => a + v, 0);
    if (total <= 0) return null;
    const f = Object.entries(groups).filter(([k]) => k.startsWith("F_")).reduce((a, [, v]) => a + v, 0);
    return (f / total) * 100;
  }
  function demoShareOf(groups, total, key) { return total > 0 ? ((groups[key] || 0) / total) * 100 : 0; }

  let storeCharts = {};
  function destroyStoreCharts() {
    Object.values(storeCharts).forEach(c => c && c.destroy());
    storeCharts = {};
  }

  function renderStoreResult(name) {
    const resultArea = document.getElementById("mystore-result");
    if (!name) { resultArea.innerHTML = ""; return; }
    destroyStoreCharts();

    const uvDaily = (METRICS.daily_store_uv && METRICS.daily_store_uv.daily_totals) || {};
    const clickDaily = (METRICS.daily_store && METRICS.daily_store.daily_totals) || {};
    const dsMetric = METRICS.daily_store;
    const storeMetric = METRICS.store_breakdown || {};
    const monthlyTotals = storeMetric.monthly_totals || {};

    const monthData = getCurPrevMonthStoreData(monthlyTotals, clickDaily);
    let curVal = 0, prevVal = 0, curLabel = "-", prevLabel = null, curRank = null, prevRank = null, totalStores = 0;
    if (monthData) {
      curLabel = monthData.curLabel; prevLabel = monthData.prevLabel;
      curVal = monthData.cur[name] || 0; prevVal = monthData.prev[name] || 0;
      const curSorted = Object.entries(monthData.cur).sort((a, b) => b[1] - a[1]);
      totalStores = curSorted.length;
      const ci = curSorted.findIndex(([n]) => n === name);
      curRank = ci >= 0 ? ci + 1 : null;
      const prevSorted = Object.entries(monthData.prev).sort((a, b) => b[1] - a[1]);
      const pi = prevSorted.findIndex(([n]) => n === name);
      prevRank = pi >= 0 ? pi + 1 : null;
    }
    const monthDelta = prevVal > 0 ? ((curVal - prevVal) / prevVal) * 100 : null;
    const rankChange = (curRank !== null && prevRank !== null) ? prevRank - curRank : null;

    const dailySeries = getStoreDailySeries(uvDaily, name);
    const totalAllTime = dailySeries.reduce((a, p) => a + p.value, 0);
    const recentDaily = dailySeries.slice(-60);
    const dailyAvg = recentDaily.length ? recentDaily.reduce((a, p) => a + p.value, 0) / recentDaily.length : null;

    const benefitMonthlyTotals = getAugmentedMonthlyTotals(storeMetric.benefit_monthly_totals || {}, clickDaily);
    const monthlySeries = getStoreMonthlySeries(benefitMonthlyTotals, name);
    const rankSeries = getStoreMonthlyRankSeries(benefitMonthlyTotals, name);

    const weekdayNames = ["일", "월", "화", "수", "목", "금", "토"];
    const wdSums = new Array(7).fill(0), wdCounts = new Array(7).fill(0);
    dailySeries.forEach(p => {
      const wd = new Date(p.date + "T00:00:00").getDay();
      wdSums[wd] += p.value; wdCounts[wd] += 1;
    });
    const wdAvgs = wdSums.map((s, i) => wdCounts[i] ? s / wdCounts[i] : 0);
    let bestWd = 0, worstWd = 0;
    wdAvgs.forEach((v, i) => {
      if (v > wdAvgs[bestWd]) bestWd = i;
      if (wdCounts[i] > 0 && (wdCounts[worstWd] === 0 || v < wdAvgs[worstWd])) worstWd = i;
    });
    const hasWeekdayData = dailySeries.length >= 14;

    const last7 = dailySeries.slice(-7), prev7 = dailySeries.slice(-14, -7);
    const avgOf = arr => arr.length ? arr.reduce((a, p) => a + p.value, 0) / arr.length : null;
    const last7Avg = avgOf(last7), prev7Avg = avgOf(prev7);
    const trendPct = (prev7Avg && prev7Avg > 0) ? ((last7Avg - prev7Avg) / prev7Avg) * 100 : null;

    const insights = [];
    if (trendPct !== null) {
      insights.push(`최근 7일 평균 방문자는 ${fmt(last7Avg)}명으로, 이전 7일(${fmt(prev7Avg)}명) 대비 ${pctBadge(trendPct)} ${trendPct >= 0 ? "증가" : "감소"} 추세예요`);
    }
    if (curRank !== null) {
      if (rankChange === null) {
        insights.push(`밀리플레이스 전체 ${totalStores}개 매장 중 <b>${curRank}위</b>예요`);
      } else if (rankChange > 0) {
        insights.push(`이번 달 <b>${curRank}위</b>로, 전월(${prevRank}위) 대비 <span class="up">▲${rankChange}계단 상승</span>했어요`);
      } else if (rankChange < 0) {
        insights.push(`이번 달 <b>${curRank}위</b>로, 전월(${prevRank}위) 대비 <span class="down">▼${Math.abs(rankChange)}계단 하락</span>했어요`);
      } else {
        insights.push(`이번 달도 <b>${curRank}위</b>로 순위 변동이 없어요`);
      }
    }
    if (hasWeekdayData) {
      insights.push(`<b>${weekdayNames[bestWd]}요일</b>에 방문자가 가장 많아요 (평균 ${fmt(wdAvgs[bestWd])}명) · <b>${weekdayNames[worstWd]}요일</b>이 가장 적어요 (평균 ${fmt(wdAvgs[worstWd])}명)`);
    }

    function rankChangeBadge() {
      if (rankChange === null) return "";
      if (rankChange > 0) return `<span class="kpi-delta up">▲ ${rankChange}계단</span>`;
      if (rankChange < 0) return `<span class="kpi-delta down">▼ ${Math.abs(rankChange)}계단</span>`;
      return `<span class="kpi-delta" style="background:#f1efe9; color:var(--ink-faint);">- 변동없음</span>`;
    }

    resultArea.innerHTML = `
      <div class="card">
        <h2>${name}</h2>
        <div class="card-note">매장 인사이트</div>
        <ul style="margin:0; padding-left:18px; font-size:13.5px; line-height:1.9;">
          ${insights.map(t => `<li>${t}</li>`).join("")}
        </ul>
      </div>

      <div class="card">
        <h2>핵심 지표</h2>
        <div class="kpi-grid">
          <div class="kpi">
            <div class="label">${curLabel} 혜택사용</div>
            <div class="value">${fmt(curVal)}<span class="unit">건</span></div>
            <div class="sub">전월(${prevLabel || "-"}) 대비 ${pctBadge(monthDelta)}</div>
          </div>
          <div class="kpi">
            <div class="label">이번 달 순위</div>
            <div class="value">${curRank ? curRank : "-"}<span class="unit">/${totalStores}개 중</span></div>
            <div class="sub">${rankChangeBadge()}</div>
          </div>
          <div class="kpi">
            <div class="label">누적 방문(UV)</div>
            <div class="value">${fmt(totalAllTime)}<span class="unit">명</span></div>
            <div class="sub" style="color:var(--ink-faint);">${dailySeries.length ? dailySeries[0].date + "~" : "-"}</div>
          </div>
        </div>
      </div>

      <div class="card sage">
        <h2>일별 방문(UV) 추이</h2>
        <div class="card-note">최근 60일 · 평균 ${dailyAvg !== null ? fmt(dailyAvg) : "-"}명/일</div>
        <div class="chart-wrap tall"><canvas id="storeDailyChart"></canvas></div>
      </div>

      <div class="two-col">
        <div class="card">
          <h2>월별 혜택사용 추이</h2>
          <div class="chart-wrap"><canvas id="storeMonthlyChart"></canvas></div>
        </div>
        <div class="card">
          <h2>매장 순위 추이</h2>
          <div class="chart-wrap"><canvas id="storeRankChart"></canvas></div>
        </div>
      </div>

      ${renderStoreDemoSection(name)}`;

    storeCharts.daily = new Chart(document.getElementById("storeDailyChart"), {
      type: "line",
      data: {
        labels: recentDaily.map(p => p.date.slice(5)),
        datasets: [
          { data: recentDaily.map(p => p.value), borderColor: "#8B4A3C", backgroundColor: "rgba(139,74,60,0.08)", fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2 },
          { data: recentDaily.map(() => dailyAvg), borderColor: "#a39a8c", borderDash: [5, 4], borderWidth: 1.3, pointRadius: 0, tension: 0, fill: false },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#a39a8c", font: { size: 9.5 }, maxTicksLimit: 8 } },
          y: { grid: { color: "#E8E0D2" }, ticks: { color: "#a39a8c", font: { size: 11 } } },
        },
      },
    });

    storeCharts.monthly = new Chart(document.getElementById("storeMonthlyChart"), {
      type: "bar",
      data: { labels: monthlySeries.map(p => p.month.slice(2)), datasets: [{ data: monthlySeries.map(p => p.value), backgroundColor: "#8B4A3C", borderRadius: 4, maxBarThickness: 22 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#a39a8c", font: { size: 9.5 } } },
          y: { grid: { color: "#E8E0D2" }, ticks: { color: "#a39a8c", font: { size: 10.5 } } },
        },
      },
    });

    storeCharts.rank = new Chart(document.getElementById("storeRankChart"), {
      type: "line",
      data: { labels: rankSeries.map(p => p.month.slice(2)), datasets: [{ data: rankSeries.map(p => p.rank), borderColor: "#6B7A5E", backgroundColor: "#6B7A5E", tension: 0.3, pointRadius: 2.5, borderWidth: 2 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#a39a8c", font: { size: 9.5 } } },
          y: { reverse: true, grid: { color: "#E8E0D2" }, ticks: { color: "#a39a8c", font: { size: 10.5 } } },
        },
      },
    });

    renderStoreDemoCharts(name);
  }

  function renderStoreDemoSection(name) {
    const sd = METRICS.store_demo;
    if (!sd || !sd.monthly_rows || Object.keys(sd.monthly_rows).length === 0) return "";
    const metricKey = sd.metric_key || "SUM(회원수(유니크))";
    const months = Object.keys(sd.monthly_rows).sort();
    const latestMonth = months[months.length - 1];
    const prevMonth = months.length >= 2 ? months[months.length - 2] : null;

    const storeCurRows = (sd.monthly_rows[latestMonth] || []).filter(r => r.place_name === name);
    if (!storeCurRows.length) return "";

    const storeCurGroups = aggregateDemoByGroup(storeCurRows, metricKey);
    const storeCurTotal = Object.values(storeCurGroups).reduce((a, v) => a + v, 0);
    const storeCurSorted = Object.entries(storeCurGroups).sort((a, b) => b[1] - a[1]);

    const storePrevRows = prevMonth ? (sd.monthly_rows[prevMonth] || []).filter(r => r.place_name === name) : [];
    const storePrevGroups = aggregateDemoByGroup(storePrevRows, metricKey);

    const allCurRows = sd.monthly_rows[latestMonth] || [];
    const allCurGroups = aggregateDemoByGroup(allCurRows, metricKey);
    const allCurTotal = Object.values(allCurGroups).reduce((a, v) => a + v, 0);

    const insights = [];
    const topStore = storeCurSorted[0];
    if (topStore) {
      const storeShare = demoShareOf(storeCurGroups, storeCurTotal, topStore[0]);
      const avgShare = demoShareOf(allCurGroups, allCurTotal, topStore[0]);
      insights.push(`이 매장은 <b>${demoGroupLabel(topStore[0])}</b> 방문객이 가장 많아요 (${storeShare.toFixed(1)}%) — 전체 매장 평균(${avgShare.toFixed(1)}%) 대비 ${pctBadge(storeShare - avgShare)}`);
    }
    const storeF = demoSexShare(storeCurGroups), avgF = demoSexShare(allCurGroups), prevF = demoSexShare(storePrevGroups);
    if (storeF !== null && avgF !== null) {
      insights.push(`여성 비중은 <b>${storeF.toFixed(1)}%</b>로, 전체 매장 평균(${avgF.toFixed(1)}%) 대비 ${pctBadge(storeF - avgF)}`);
    }
    if (storeF !== null && prevF !== null) {
      insights.push(`전월(${prevF.toFixed(1)}%) 대비 여성 비중이 ${pctBadge(storeF - prevF)} 변화했어요`);
    }

    return `<div class="card">
      <h2>방문객 Demo (${latestMonth})</h2>
      <ul style="margin:0 0 16px; padding-left:18px; font-size:13.5px; line-height:1.9;">
        ${insights.map(t => `<li>${t}</li>`).join("")}
      </ul>
      <div class="two-col">
        <div>
          <div style="text-align:center; font-size:12px; color:var(--ink-faint); margin-bottom:6px;">성별 비중</div>
          <div style="height:200px;"><canvas id="storeDemoGenderChart"></canvas></div>
        </div>
        <div>
          <div style="text-align:center; font-size:12px; color:var(--ink-faint); margin-bottom:6px;">연령대 비중</div>
          <div style="height:200px;"><canvas id="storeDemoAgeChart"></canvas></div>
        </div>
      </div>
    </div>`;
  }

  function renderStoreDemoCharts(name) {
    const genderCanvas = document.getElementById("storeDemoGenderChart");
    if (!genderCanvas) return;
    const sd = METRICS.store_demo;
    const metricKey = sd.metric_key || "SUM(회원수(유니크))";
    const months = Object.keys(sd.monthly_rows).sort();
    const latestMonth = months[months.length - 1];
    const storeCurRows = (sd.monthly_rows[latestMonth] || []).filter(r => r.place_name === name);
    const storeCurGroups = aggregateDemoByGroup(storeCurRows, metricKey);

    const genderData = { F: 0, M: 0 };
    Object.entries(storeCurGroups).forEach(([k, v]) => { const sex = k.split("_")[0]; if (genderData[sex] !== undefined) genderData[sex] += v; });

    storeCharts.demoGender = new Chart(genderCanvas, {
      type: "doughnut",
      data: { labels: ["여성", "남성"], datasets: [{ data: [genderData.F, genderData.M], backgroundColor: ["#8B4A3C", "#6B7A5E"], borderWidth: 2, borderColor: "#fff" }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "bottom", labels: { font: { size: 11 }, boxWidth: 10, padding: 12 } } },
      },
    });

    const AGE_ORDER = ["영유아", "10", "20", "30", "40", "50", "60", "70", "80", "90"];
    const AGE_COLORS = ["#c9a48a", "#8B4A3C", "#b8863b", "#6B7A5E", "#94785f", "#a6785e", "#7c6a5a", "#5c7a6e", "#9c8a4a", "#a35c4a"];
    const ageData = {};
    AGE_ORDER.forEach(a => { ageData[a] = 0; });
    Object.entries(storeCurGroups).forEach(([k, v]) => { const age = k.split("_")[1]; if (ageData[age] !== undefined) ageData[age] += v; });
    const ageLabels = AGE_ORDER.filter(a => ageData[a] > 0);
    const ageValues = ageLabels.map(a => ageData[a]);
    const ageColors = ageLabels.map(a => AGE_COLORS[AGE_ORDER.indexOf(a)]);

    storeCharts.demoAge = new Chart(document.getElementById("storeDemoAgeChart"), {
      type: "doughnut",
      data: { labels: ageLabels.map(demoAgeLabel), datasets: [{ data: ageValues, backgroundColor: ageColors, borderWidth: 2, borderColor: "#fff" }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: "bottom", labels: { font: { size: 10 }, boxWidth: 10, padding: 8 } } },
      },
    });
  }

  function renderMystoreTab() {
    const area = document.getElementById("mystore-area");
    const params = new URLSearchParams(window.location.search);
    const token = params.get("t");
    const name = token ? PARTNER_TOKENS[token] : null;

    if (!name) {
      area.innerHTML = `
        <div class="card">
          <h2>우리 매장 데이터 조회</h2>
          <div class="card-note">이 화면은 매장별 개인 링크로만 확인하실 수 있어요</div>
          <div class="placeholder" style="padding:30px 10px;">
            <div class="icon">🔒</div>
            <h3>개인 링크가 필요해요</h3>
            <p>담당 매니저가 안내해드린 링크로 접속해주세요.</p>
          </div>
        </div>`;
      return;
    }
    area.innerHTML = `<div id="mystore-result"></div>`;
    renderStoreResult(name);
  }

  /* ================= 탭 3: 마케팅 소식 ================= */
  function buildBannerPeriods(history) {
    if (!history || !history.days) return [];
    const dates = Object.keys(history.days).sort();
    if (!dates.length) return [];
    const meta = history.meta || {};
    const periods = [];
    let cur = null;
    dates.forEach(date => {
      const images = history.days[date].images || [];
      const signature = images.slice().sort().join("|");
      if (cur && cur.signature === signature) {
        cur.end = date;
      } else {
        if (cur) periods.push(cur);
        cur = { start: date, end: date, signature, images };
      }
    });
    if (cur) periods.push(cur);
    return periods.reverse().map(p => ({
      start: p.start, end: p.end,
      slides: p.images.map(img => ({
        image: img,
        title: (meta[img] && meta[img].title) || "",
        subtitle: (meta[img] && meta[img].subtitle) || "",
      })),
    }));
  }

  function renderMarketingTab() {
    const area = document.getElementById("marketing-area");
    const current = BANNER_DATA && BANNER_DATA.slides && BANNER_DATA.slides.length ? BANNER_DATA : null;
    const periods = buildBannerPeriods(BANNER_HISTORY).slice(0, 8);

    if (!current && !periods.length) {
      area.innerHTML = `<div class="placeholder"><div class="icon">📰</div><h3>소식 준비 중</h3><p>곧 마케팅 소식을 보여드릴게요.</p></div>`;
      return;
    }

    const currentHtml = current ? `
      <div class="card">
        <h2>지금 밀리플레이스 메인에 소개되고 있어요</h2>
        <div class="card-note">${current.captured_at ? current.captured_at.slice(0, 10) + " 기준" : ""}</div>
        <div class="banner-grid">
          ${current.slides.map(s => `
            <div class="banner-item">
              <img src="${s.image}" alt="${s.title}" loading="lazy">
              <div class="cap">
                <div class="t">${s.title}</div>
                <div class="s">${s.subtitle}</div>
              </div>
            </div>`).join("")}
        </div>
      </div>` : "";

    const historyHtml = periods.length ? `
      <div class="card sage">
        <h2>메인 배너 소개 이력</h2>
        <div class="card-note">최근 소개된 순서예요</div>
        ${periods.map(p => `
          <div class="period-row">
            <div class="range">${p.start}${p.start !== p.end ? " ~ " + p.end : ""}</div>
            <div class="thumb-row">
              ${p.slides.map(s => `
                <div class="thumb">
                  <img src="${s.image}" alt="${s.title}" loading="lazy">
                  <div class="tt">${s.title}</div>
                </div>`).join("")}
            </div>
          </div>`).join("")}
      </div>` : "";

    area.innerHTML = currentHtml + historyHtml;
  }

  /* ================= 로드 ================= */
  async function load() {
    setupTabs();
    try {
      const res = await fetch("./data.json", { cache: "no-store" });
      if (res.ok) {
        const data = await res.json();
        METRICS = data.metrics || {};
      }
    } catch (e) { /* noop */ }

    try {
      const r1 = await fetch("./millieplace_banner.json", { cache: "no-store" });
      if (r1.ok) BANNER_DATA = await r1.json();
    } catch (e) { BANNER_DATA = null; }

    try {
      const r2 = await fetch("./millieplace_banner_history.json", { cache: "no-store" });
      if (r2.ok) BANNER_HISTORY = await r2.json();
    } catch (e) { BANNER_HISTORY = null; }

    try {
      const r3 = await fetch("./partner_tokens.json", { cache: "no-store" });
      if (r3.ok) PARTNER_TOKENS = await r3.json();
    } catch (e) { PARTNER_TOKENS = {}; }

    renderOverviewTab();
    renderMystoreTab();
    renderMarketingTab();
  }

  load();
})();
</script>
</body>
</html>
