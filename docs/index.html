<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>밀리플레이스 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root {
    --bg: #eef0f3;
    --card: #ffffff;
    --border: #e3e6eb;
    --ink: #12151b;
    --ink-soft: #667085;
    --ink-faint: #9aa2b1;
    --accent: #a8562a;
    --accent-soft: #f6e9dc;
    --uv-color: #a8562a;
    --benefit-color: #2563eb;
    --staff-color: #7c3aed;
    --good: #15803d;
    --bad: #dc2626;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }
  .topbar .title-block .eyebrow {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.03em;
    margin-bottom: 5px;
  }
  .topbar h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
  }
  .status-pill .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 0 3px rgba(21,128,61,0.15);
  }

  /* ---------- KPI cards ---------- */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 14px;
  }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 16px 18px 12px;
  }
  .kpi-card .kpi-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .kpi-card .kpi-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kpi-card .kpi-dot {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .kpi-card .kpi-value-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .kpi-card .kpi-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .kpi-card .kpi-value .unit {
    font-size: 12.5px;
    color: var(--ink-faint);
    font-weight: 500;
    margin-left: 3px;
  }
  .kpi-card .kpi-delta {
    font-size: 11.5px;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    padding: 1px 6px;
    border-radius: 5px;
  }
  .kpi-delta.up { color: var(--good); background: rgba(21,128,61,0.08); }
  .kpi-delta.down { color: var(--bad); background: rgba(220,38,38,0.08); }
  .kpi-card .kpi-spark {
    height: 36px;
    margin-top: 6px;
  }

  /* ---------- Section cards ---------- */
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 18px 20px 20px;
    margin-bottom: 14px;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .section-head h2 {
    font-size: 14.5px;
    font-weight: 700;
    margin: 0;
  }
  .section-head .legend {
    display: flex;
    gap: 13px;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Segmented control */
  .segmented {
    display: inline-flex;
    background: #f1f2f5;
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }
  .segmented button {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .segmented button.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(16,24,40,0.08);
  }
  .segmented button:hover:not(.active) { color: var(--ink); }

  select.store-select {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    background: #f1f2f5;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
  }

  .trend-chart-wrap { height: 270px; }

  .two-col {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 14px;
  }

  .bar-chart-wrap { height: 300px; }

  .store-stats-row {
    display: flex;
    gap: 20px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .store-stat { }
  .store-stat .label { font-size: 11px; color: var(--ink-faint); margin-bottom: 2px; }
  .store-stat .value { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600; }

  table.rank-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.rank-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.rank-table td {
    padding: 8px 8px;
    border-bottom: 1px solid #f0f1f3;
  }
  table.rank-table tr:last-child td { border-bottom: none; }
  table.rank-table tr.highlight { background: var(--accent-soft); }
  table.rank-table td.rank-num {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-faint);
    width: 26px;
  }
  table.rank-table td.rank-val {
    font-family: 'IBM Plex Mono', monospace;
    text-align: right;
    font-weight: 600;
  }

  .empty-note {
    font-size: 12.5px;
    color: var(--ink-faint);
    padding: 20px 0;
    text-align: center;
  }

  .footer {
    text-align: center;
    margin-top: 22px;
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  .loading, .error {
    text-align: center;
    padding: 60px 0;
    font-size: 13px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
  }
  .error { color: var(--bad); }

  @media (max-width: 760px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title-block">
        <div class="eyebrow">MILLIE'S LIBRARY × CAFE PARTNERSHIP</div>
        <h1>밀리플레이스 대시보드</h1>
      </div>
      <div class="status-pill"><span class="dot"></span><span id="updated-at">불러오는 중...</span></div>
    </div>

    <div id="dashboard-area">
      <div class="loading">데이터 불러오는 중...</div>
    </div>

    <div class="footer">밀리의서재 · Millie Place</div>
  </div>

<script>
  Chart.register(ChartDataLabels);

  const COLORS = { uv: "#a8562a", benefit_claims: "#2563eb", staff_verifications: "#7c3aed" };
  const METRIC_ORDER = ["uv", "benefit_claims", "staff_verifications"];
  const STORE_KEY = "store_breakdown";

  let METRICS_DATA = {};
  let STORE_ROWS = [];
  let currentPeriod = "day";
  let trendChartInstance = null;
  let storeChartInstance = null;

  function fmt(n) {
    if (n === null || n === undefined) return "-";
    return Math.round(n).toLocaleString("ko-KR");
  }

  function sparklineSvg(series, color) {
    if (!series || series.length < 2) return "";
    const recent = series.slice(-30);
    const w = 240, h = 36, pad = 3;
    const values = recent.map(p => p.value);
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max - min) || 1;
    const step = (w - pad * 2) / (recent.length - 1);
    const pts = values.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  function weeklyDelta(series) {
    if (!series || series.length < 14) return null;
    const last7 = series.slice(-7).reduce((a, p) => a + p.value, 0);
    const prev7 = series.slice(-14, -7).reduce((a, p) => a + p.value, 0);
    if (prev7 === 0) return null;
    return ((last7 - prev7) / prev7) * 100;
  }

  function kpiCard(key, metric) {
    const color = COLORS[key];
    const spark = sparklineSvg(metric.series, color);
    const delta = weeklyDelta(metric.series);
    let deltaHtml = "";
    if (delta !== null) {
      const cls = delta >= 0 ? "up" : "down";
      const arrow = delta >= 0 ? "▲" : "▼";
      deltaHtml = `<span class="kpi-delta ${cls}">${arrow} ${Math.abs(delta).toFixed(1)}%</span>`;
    }
    return `
      <div class="kpi-card">
        <div class="kpi-top">
          <div class="kpi-label"><span class="kpi-dot" style="background:${color}"></span>${metric.label}</div>
        </div>
        <div class="kpi-value-row">
          <div class="kpi-value">${fmt(metric.total)}<span class="unit">건</span></div>
          ${deltaHtml}
        </div>
        <div class="kpi-spark">${spark}</div>
      </div>`;
  }

  function getQuarter(dateStr) {
    const month = parseInt(dateStr.slice(5, 7), 10);
    return Math.ceil(month / 3);
  }

  function aggregateSeries(series, period) {
    if (!series || series.length === 0) return [];
    if (period === "day") {
      return series.slice(-30).map(p => ({ key: p.date, label: p.date.slice(5), value: p.value }));
    }
    const buckets = {};
    series.forEach(p => {
      let key;
      if (period === "month") key = p.date.slice(0, 7);
      else key = `${p.date.slice(0, 4)}-Q${getQuarter(p.date)}`;
      buckets[key] = (buckets[key] || 0) + p.value;
    });
    return Object.keys(buckets).sort().map(key => ({
      key,
      label: period === "month" ? key : key.replace("-", " "),
      value: buckets[key],
    }));
  }

  function renderTrendChart() {
    const ctx = document.getElementById("trendChart");
    if (!ctx) return;
    if (trendChartInstance) { trendChartInstance.destroy(); trendChartInstance = null; }

    const perMetric = {};
    let allKeys = new Set();
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (m && m.series && m.series.length) {
        const agg = aggregateSeries(m.series, currentPeriod);
        perMetric[key] = agg;
        agg.forEach(p => allKeys.add(p.key));
      }
    });
    const sortedKeys = Array.from(allKeys).sort();
    if (sortedKeys.length === 0) return;

    const labelMap = {};
    METRIC_ORDER.forEach(key => {
      (perMetric[key] || []).forEach(p => { labelMap[p.key] = p.label; });
    });
    const labels = sortedKeys.map(k => labelMap[k] || k);

    const datasets = METRIC_ORDER.filter(k => perMetric[k]).map(key => {
      const valueByKey = {};
      perMetric[key].forEach(p => { valueByKey[p.key] = p.value; });
      return {
        label: METRICS_DATA[key].label,
        data: sortedKeys.map(k => valueByKey[k] !== undefined ? valueByKey[k] : null),
        borderColor: COLORS[key],
        backgroundColor: COLORS[key],
        tension: 0.3,
        pointRadius: currentPeriod === "day" ? 0 : 3,
        pointBackgroundColor: COLORS[key],
        borderWidth: 2,
        spanGaps: true,
      };
    });

    const showLabels = sortedKeys.length <= 12;

    trendChartInstance = new Chart(ctx, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          datalabels: showLabels ? {
            align: "top",
            font: { size: 10, family: "'IBM Plex Mono', monospace", weight: 600 },
            color: (c) => c.dataset.borderColor,
            formatter: (v) => v === null ? "" : Math.round(v).toLocaleString("ko-KR"),
          } : { display: false },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#9ca3af", font: { size: 11 } } },
          y: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },
        },
      },
    });
  }

  function computeStoreTotals(rows, metricKey, labelKey) {
    const totals = {};
    rows.forEach(r => {
      const name = r[labelKey];
      totals[name] = (totals[name] || 0) + (Number(r[metricKey]) || 0);
    });
    return Object.entries(totals).sort((a, b) => b[1] - a[1]);
  }

  function computeStoreMonthly(rows, metricKey, storeName, labelKey) {
    const filtered = rows.filter(r => r[labelKey] === storeName);
    const buckets = {};
    filtered.forEach(r => {
      const monthRaw = r["produce_month"];
      let key = "기타";
      if (typeof monthRaw === "number") {
        key = new Date(monthRaw).toISOString().slice(0, 7);
      }
      buckets[key] = (buckets[key] || 0) + (Number(r[metricKey]) || 0);
    });
    return Object.keys(buckets).sort().map(k => ({ label: k, value: buckets[k] }));
  }

  function renderStoreSection() {
    const storeMetric = METRICS_DATA[STORE_KEY];
    const selectEl = document.getElementById("store-select");
    const selected = selectEl ? selectEl.value : "__all__";

    if (!storeMetric || !storeMetric.data || !storeMetric.data.length) {
      document.getElementById("store-chart-area").innerHTML = '<div class="empty-note">아직 매장별 데이터가 없습니다.</div>';
      document.getElementById("rank-table-area").innerHTML = "";
      return;
    }
    const { data, metric_key, label_key } = storeMetric;
    if (!metric_key || !label_key) return;

    const ctxEl = document.getElementById("storeBarChart");
    if (storeChartInstance) { storeChartInstance.destroy(); storeChartInstance = null; }

    if (selected === "__all__") {
      const sorted = computeStoreTotals(data, metric_key, label_key).slice(0, 10);
      storeChartInstance = new Chart(ctxEl, {
        type: "bar",
        data: {
          labels: sorted.map(([name]) => name),
          datasets: [{ data: sorted.map(([, v]) => v), backgroundColor: "#a8562a", borderRadius: 4, maxBarThickness: 20 }],
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            datalabels: {
              anchor: "end", align: "right",
              font: { size: 10.5, family: "'IBM Plex Mono', monospace", weight: 600 },
              color: "#374151",
              formatter: (v) => v.toLocaleString("ko-KR"),
            },
          },
          scales: {
            x: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },
            y: { grid: { display: false }, ticks: { color: "#374151", font: { size: 12 } } },
          },
        },
      });

      const allSorted = computeStoreTotals(data, metric_key, label_key);
      const rows = allSorted.slice(0, 12).map(([name, val], i) => `
        <tr>
          <td class="rank-num">${String(i + 1).padStart(2, "0")}</td>
          <td>${name}</td>
          <td class="rank-val">${fmt(val)}</td>
        </tr>`).join("");
      document.getElementById("rank-table-area").innerHTML = `
        <table class="rank-table">
          <thead><tr><th>순위</th><th>매장</th><th style="text-align:right">건수</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    } else {
      const monthly = computeStoreMonthly(data, metric_key, selected, label_key);
      const total = monthly.reduce((a, p) => a + p.value, 0);
      const allSorted = computeStoreTotals(data, metric_key, label_key);
      const rank = allSorted.findIndex(([name]) => name === selected) + 1;

      storeChartInstance = new Chart(ctxEl, {
        type: "bar",
        data: {
          labels: monthly.map(p => p.label),
          datasets: [{ data: monthly.map(p => p.value), backgroundColor: "#a8562a", borderRadius: 5, maxBarThickness: 40 }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            datalabels: {
              anchor: "end", align: "top",
              font: { size: 11, family: "'IBM Plex Mono', monospace", weight: 600 },
              color: "#374151",
              formatter: (v) => v.toLocaleString("ko-KR"),
            },
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: "#9ca3af", font: { size: 11 } } },
            y: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },
          },
        },
      });

      document.getElementById("rank-table-area").innerHTML = `
        <div class="store-stats-row">
          <div class="store-stat"><div class="label">전체 순위</div><div class="value">${rank || "-"}위</div></div>
          <div class="store-stat"><div class="label">누적 건수</div><div class="value">${fmt(total)}</div></div>
        </div>
        <table class="rank-table">
          <thead><tr><th>월</th><th style="text-align:right">건수</th></tr></thead>
          <tbody>${monthly.map(p => `<tr><td>${p.label}</td><td class="rank-val">${fmt(p.value)}</td></tr>`).join("")}</tbody>
        </table>`;
    }
  }

  function setupPeriodToggle() {
    document.querySelectorAll("#period-toggle button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#period-toggle button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentPeriod = btn.dataset.period;
        renderTrendChart();
      });
    });
  }

  function setupStoreSelect() {
    const storeMetric = METRICS_DATA[STORE_KEY];
    const selectEl = document.getElementById("store-select");
    if (!storeMetric || !storeMetric.data || !storeMetric.data.length || !selectEl) return;
    const { metric_key, label_key, data } = storeMetric;
    const sorted = computeStoreTotals(data, metric_key, label_key);
    selectEl.innerHTML = `<option value="__all__">전체 매장 (TOP 10)</option>` +
      sorted.map(([name]) => `<option value="${name}">${name}</option>`).join("");
    selectEl.addEventListener("change", renderStoreSection);
  }

  async function load() {
    const area = document.getElementById("dashboard-area");
    try {
      const res = await fetch("./data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("data.json을 불러오지 못했습니다");
      const data = await res.json();
      METRICS_DATA = data.metrics || {};

      let kpiHtml = "";
      METRIC_ORDER.forEach(key => {
        if (METRICS_DATA[key]) kpiHtml += kpiCard(key, METRICS_DATA[key]);
      });

      const storeMetric = METRICS_DATA[STORE_KEY];
      const hasStoreData = storeMetric && storeMetric.data && storeMetric.data.length;

      area.innerHTML = `
        <div class="kpi-grid">${kpiHtml}</div>

        <div class="section-card">
          <div class="section-head">
            <h2>일별 추이</h2>
            <div style="display:flex; align-items:center; gap:16px;">
              <div class="legend">
                ${METRIC_ORDER.filter(k => METRICS_DATA[k]).map(k => `
                  <span class="legend-item"><span class="legend-dot" style="background:${COLORS[k]}"></span>${METRICS_DATA[k].label}</span>
                `).join("")}
              </div>
              <div class="segmented" id="period-toggle">
                <button class="active" data-period="day">일별</button>
                <button data-period="month">월별</button>
                <button data-period="quarter">분기별</button>
              </div>
            </div>
          </div>
          <div class="trend-chart-wrap"><canvas id="trendChart"></canvas></div>
        </div>

        <div class="two-col">
          <div class="section-card">
            <div class="section-head">
              <h2>매장별 데이터</h2>
              <select class="store-select" id="store-select"><option>매장 불러오는 중...</option></select>
            </div>
            <div class="bar-chart-wrap" id="store-chart-area">
              ${hasStoreData ? '<canvas id="storeBarChart"></canvas>' : '<div class="empty-note">아직 매장별 데이터가 없습니다.</div>'}
            </div>
          </div>
          <div class="section-card">
            <div class="section-head"><h2>상세</h2></div>
            <div id="rank-table-area"></div>
          </div>
        </div>
      `;

      renderTrendChart();
      setupPeriodToggle();
      if (hasStoreData) {
        setupStoreSelect();
        renderStoreSection();
      }

      document.getElementById("updated-at").textContent = data.updated_at || "-";
    } catch (e) {
      area.innerHTML = `<div class="error">데이터를 불러오지 못했습니다.<br>${e.message}</div>`;
      document.getElementById("updated-at").textContent = "오류";
    }
  }

  load();
</script>
</body>
</html>
