<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>밀리플레이스 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root {
    --bg: #eef0f3;
    --card: #ffffff;
    --border: #e3e6eb;
    --ink: #12151b;
    --ink-soft: #667085;
    --ink-faint: #9aa2b1;
    --accent: #a8562a;
    --accent-soft: #f6e9dc;
    --uv-color: #6366f1;
    --benefit-color: #06b6d4;
    --staff-color: #f59e0b;
    --good: #15803d;
    --bad: #dc2626;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
  }
  .topbar .title-block .eyebrow {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.03em;
    margin-bottom: 5px;
  }
  .topbar h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
  }
  .status-pill .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 0 3px rgba(21,128,61,0.15);
  }

  /* ---------- Tabs ---------- */
  .tab-nav {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-nav button {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-faint);
    padding: 10px 4px;
    margin-right: 22px;
    cursor: pointer;
    position: relative;
    top: 1px;
  }
  .tab-nav button.active {
    color: var(--ink);
    border-bottom: 2px solid var(--accent);
  }
  .tab-nav button:hover:not(.active) { color: var(--ink-soft); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .sub-tab-nav {
    display: inline-flex;
    background: #f1f2f5;
    border-radius: 9px;
    padding: 3px;
    gap: 2px;
    margin-bottom: 16px;
  }
  .sub-tab-nav button {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sub-tab-nav button.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(16,24,40,0.08);
  }
  .sub-tab-nav button:hover:not(.active) { color: var(--ink); }

  .sub-tab-panel { display: none; }
  .sub-tab-panel.active { display: block; }

  .placeholder-panel {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 60px 20px;
    text-align: center;
  }
  .placeholder-panel .icon { font-size: 28px; margin-bottom: 10px; }
  .placeholder-panel h3 { font-size: 15px; margin: 0 0 6px; }
  .placeholder-panel p { font-size: 13px; color: var(--ink-soft); margin: 0; }

  /* ---------- KPI cards ---------- */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 14px;
  }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 16px 18px 12px;
  }
  .kpi-card .kpi-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .kpi-card .kpi-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kpi-card .kpi-dot {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .kpi-card .kpi-value-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .kpi-card .kpi-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .kpi-card .kpi-value .unit {
    font-size: 12.5px;
    color: var(--ink-faint);
    font-weight: 500;
    margin-left: 3px;
  }
  .kpi-card .kpi-delta {
    font-size: 11.5px;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    padding: 1px 6px;
    border-radius: 5px;
  }
  .kpi-delta.up { color: var(--good); background: rgba(21,128,61,0.08); }
  .kpi-delta.down { color: var(--bad); background: rgba(220,38,38,0.08); }
  .kpi-card .kpi-spark {
    height: 46px;
    margin-top: 6px;
  }
  .kpi-card .kpi-sub {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  /* ---------- Section cards ---------- */
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 18px 20px 20px;
    margin-bottom: 14px;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .section-head h2 {
    font-size: 14.5px;
    font-weight: 700;
    margin: 0;
  }
  .section-head .legend {
    display: flex;
    gap: 13px;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Segmented control */
  .segmented {
    display: inline-flex;
    background: #f1f2f5;
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }
  .segmented button {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .segmented button.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(16,24,40,0.08);
  }
  .segmented button:hover:not(.active) { color: var(--ink); }

  select.store-select {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    background: #f1f2f5;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
  }

  .trend-chart-wrap { height: 270px; }
  .trend-chart-wrap.tall { height: 320px; }

  .two-col {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 14px;
  }

  .bar-chart-wrap { height: 300px; }
  .bar-chart-wrap.tall { height: 420px; }

  .store-stats-row {
    display: flex;
    gap: 20px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .store-stat { }
  .store-stat .label { font-size: 11px; color: var(--ink-faint); margin-bottom: 2px; }
  .store-stat .value { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600; }

  table.rank-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.rank-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.rank-table td {
    padding: 8px 8px;
    border-bottom: 1px solid #f0f1f3;
  }
  table.rank-table tr:last-child td { border-bottom: none; }
  table.rank-table td.rank-num {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-faint);
    width: 26px;
  }
  table.rank-table td.rank-val {
    font-family: 'IBM Plex Mono', monospace;
    text-align: right;
    font-weight: 600;
  }
  table.rank-table tr.highlight td {
    background: var(--accent-soft);
    border-top: 2px solid var(--accent);
    border-bottom: none;
  }

  .empty-note {
    font-size: 12.5px;
    color: var(--ink-faint);
    padding: 20px 0;
    text-align: center;
  }

  .footer {
    text-align: center;
    margin-top: 22px;
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  .loading, .error {
    text-align: center;
    padding: 60px 0;
    font-size: 13px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
  }
  .error { color: var(--bad); }

  @media (max-width: 760px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title-block">
        <div class="eyebrow">MILLIE PLACE × PARTNERSHIP</div>
        <h1>밀리플레이스 대시보드</h1>
      </div>
      <div class="status-pill"><span class="dot"></span><span id="updated-at">불러오는 중...</span></div>
    </div>

    <div class="tab-nav" id="tab-nav">
      <button class="active" data-tab="kpi">KPI</button>
      <button data-tab="daily">일별 트래킹</button>
      <button data-tab="weekly">주간 데이터</button>
      <button data-tab="monthly">월간 데이터</button>
      <button data-tab="partner">제휴처별 데이터</button>
      <button data-tab="event">이벤트 Tracking</button>
    </div>

    <div class="tab-panel active" id="tab-kpi">
      <div id="kpi-area"><div class="loading">데이터 불러오는 중...</div></div>
    </div>

    <div class="tab-panel" id="tab-daily">
      <div id="daily-area"></div>
    </div>

    <div class="tab-panel" id="tab-weekly">
      <div id="weekly-area"></div>
    </div>

    <div class="tab-panel" id="tab-monthly">
      <div id="monthly-area"></div>
    </div>

    <div class="tab-panel" id="tab-partner">
      <div id="partner-area"></div>
    </div>

    <div class="tab-panel" id="tab-event">
      <div id="event-area"></div>
    </div>

    <div class="footer">밀리의서재 · Millie Place</div>
  </div>

<script>
  Chart.register(ChartDataLabels);

  const COLORS = { uv: "#6366f1", benefit_claims: "#06b6d4", staff_verifications: "#f59e0b" };
  const LABEL_POS = {
    uv: { align: "top", anchor: "end" },
    benefit_claims: { align: "top", anchor: "end" },
    staff_verifications: { align: "bottom", anchor: "start" },
  };
  const METRIC_ORDER = ["uv", "benefit_claims", "staff_verifications"];
  const STORE_KEY = "store_breakdown";

  const KPI_TARGETS = {
    uv: {
      "2026-01": 50000, "2026-02": 50000, "2026-03": 50000, "2026-04": 50000,
      "2026-05": 50000, "2026-06": 50000, "2026-07": 30000, "2026-08": 35000,
      "2026-09": 40000, "2026-10": 45000, "2026-11": 50000, "2026-12": 50000,
    },
    benefit_claims: {
      "2026-01": 5000, "2026-02": 5000, "2026-03": 5000, "2026-04": 5000,
      "2026-05": 5000, "2026-06": 5000, "2026-07": 3000, "2026-08": 3500,
      "2026-09": 4000, "2026-10": 4500, "2026-11": 5000, "2026-12": 5000,
    },
    staff_verifications: {
      "2026-01": 6300, "2026-02": 6300, "2026-03": 6300, "2026-04": 6300,
      "2026-05": 6300, "2026-06": 6300, "2026-07": 2700, "2026-08": 3150,
      "2026-09": 3600, "2026-10": 4050, "2026-11": 4500, "2026-12": 4500,
    },
  };

  let METRICS_DATA = {};
  let monthlyPeriod = "month";
  let dailyChartInstance = null;
  let weeklyChartInstance = null;
  let monthlyChartInstance = null;
  let storeChartInstance = null;

  function fmt(n) {
    if (n === null || n === undefined) return "-";
    return Math.round(n).toLocaleString("ko-KR");
  }

  function sparklineSvg(values, color) {
    if (!values || values.length < 2) return "";
    const w = 240, h = 46, padX = 4, padTop = 11, padBottom = 13;
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max - min) || 1;
    const step = (w - padX * 2) / (values.length - 1);
    const coords = values.map((v, i) => {
      const x = padX + i * step;
      const y = h - padBottom - ((v - min) / range) * (h - padTop - padBottom);
      return [x, y];
    });
    const linePts = coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    const areaPts = `${padX},${h - padBottom} ${linePts} ${(w - padX).toFixed(1)},${h - padBottom}`;
    const gradId = "spark-" + color.replace("#", "");
    const [lastX, lastY] = coords[coords.length - 1];

    let maxIdx = 0, minIdx = 0;
    values.forEach((v, i) => {
      if (v > values[maxIdx]) maxIdx = i;
      if (v < values[minIdx]) minIdx = i;
    });
    const [maxX, maxY] = coords[maxIdx];
    const [minX, minY] = coords[minIdx];

    function anchorFor(i) {
      const ratio = i / (values.length - 1);
      if (ratio < 0.12) return "start";
      if (ratio > 0.88) return "end";
      return "middle";
    }

    const markers = [];
    const labels = [];
    const fontProps = `font-size="8" font-family="'IBM Plex Mono', monospace" font-weight="700"`;

    if (maxIdx !== values.length - 1) {
      markers.push(`<circle cx="${maxX.toFixed(1)}" cy="${maxY.toFixed(1)}" r="2.2" fill="${color}"/>`);
    }
    labels.push(`<text x="${maxX.toFixed(1)}" y="${(maxY - 4).toFixed(1)}" ${fontProps} fill="${color}" text-anchor="${anchorFor(maxIdx)}">${Math.round(values[maxIdx]).toLocaleString("ko-KR")}</text>`);

    if (minIdx !== maxIdx) {
      if (minIdx !== values.length - 1) {
        markers.push(`<circle cx="${minX.toFixed(1)}" cy="${minY.toFixed(1)}" r="2.2" fill="#9ca3af"/>`);
      }
      labels.push(`<text x="${minX.toFixed(1)}" y="${(minY + 10).toFixed(1)}" ${fontProps} fill="#9ca3af" text-anchor="${anchorFor(minIdx)}">${Math.round(values[minIdx]).toLocaleString("ko-KR")}</text>`);
    }

    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <polygon points="${areaPts}" fill="url(#${gradId})" stroke="none"/>
      <polyline points="${linePts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${markers.join("")}
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2.5" fill="${color}"/>
      ${labels.join("")}
    </svg>`;
  }

  function computeSparkStats(points) {
    if (!points || points.length === 0) return null;
    let maxP = points[0], minP = points[0];
    points.forEach(p => {
      if (p.value > maxP.value) maxP = p;
      if (p.value < minP.value) minP = p;
    });
    return { maxP, minP };
  }

  function weeklyDelta(series) {
    if (!series || series.length < 14) return null;
    const last7 = series.slice(-7).reduce((a, p) => a + p.value, 0);
    const prev7 = series.slice(-14, -7).reduce((a, p) => a + p.value, 0);
    if (prev7 === 0) return null;
    return ((last7 - prev7) / prev7) * 100;
  }

  function deltaBadge(delta) {
    if (delta === null || delta === undefined || !isFinite(delta)) return "";
    const cls = delta >= 0 ? "up" : "down";
    const arrow = delta >= 0 ? "▲" : "▼";
    return `<span class="kpi-delta ${cls}">${arrow} ${Math.abs(delta).toFixed(1)}%</span>`;
  }

  function getQuarter(dateStr) {
    const month = parseInt(dateStr.slice(5, 7), 10);
    return Math.ceil(month / 3);
  }

  function aggregateSeries(series, period) {
    if (!series || series.length === 0) return [];
    if (period === "day") {
      return series.slice(-30).map(p => ({ key: p.date, label: p.date.slice(5), value: p.value }));
    }
    const buckets = {};
    series.forEach(p => {
      let key;
      if (period === "month") key = p.date.slice(0, 7);
      else key = `${p.date.slice(0, 4)}-Q${getQuarter(p.date)}`;
      buckets[key] = (buckets[key] || 0) + p.value;
    });
    return Object.keys(buckets).sort().map(key => ({
      key,
      label: period === "month" ? key : key.replace("-", " "),
      value: buckets[key],
    }));
  }

  /* ================= KPI 탭 ================= */

  function buildKpiRows(key) {
    const m = METRICS_DATA[key];
    const targets = KPI_TARGETS[key];
    const monthKeys = Object.keys(targets).sort();
    const actualByMonth = {};
    if (m && m.series && m.series.length) {
      aggregateSeries(m.series, "month").forEach(p => { actualByMonth[p.key] = p.value; });
    }

    return monthKeys.map(mk => {
      const target = targets[mk];
      const actual = actualByMonth[mk];
      const hasActual = actual !== undefined;
      const achievement = (hasActual && target > 0) ? (actual / target) * 100 : null;

      const [y, mo] = mk.split("-").map(Number);
      let py = y, pmo = mo - 1;
      if (pmo === 0) { pmo = 12; py -= 1; }
      const prevKey = `${py}-${String(pmo).padStart(2, "0")}`;
      const prevActual = actualByMonth[prevKey];
      const momDelta = (hasActual && prevActual) ? ((actual - prevActual) / prevActual) * 100 : null;

      const yoyKey = `${y - 1}-${String(mo).padStart(2, "0")}`;
      const yoyActual = actualByMonth[yoyKey];
      const yoyDelta = (hasActual && yoyActual) ? ((actual - yoyActual) / yoyActual) * 100 : null;

      return { month: mk, target, actual, hasActual, achievement, momDelta, yoyDelta };
    });
  }

  function achievementBadge(pct) {
    if (pct === null) return `<span style="color:var(--ink-faint);">-</span>`;
    let color = "var(--bad)";
    if (pct >= 100) color = "var(--good)";
    else if (pct >= 80) color = "#b45309";
    return `<span style="color:${color}; font-weight:700;">${pct.toFixed(0)}%</span>`;
  }

  function changeText(pct) {
    if (pct === null) return `<span style="color:var(--ink-faint);">-</span>`;
    const up = pct >= 0;
    return `<span style="color:${up ? "var(--good)" : "var(--bad)"};">${up ? "▲" : "▼"} ${Math.abs(pct).toFixed(1)}%</span>`;
  }

  function renderKpiSummaryCards() {
    let html = "";
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (!m) return;
      const color = COLORS[key];
      const cmp = getCompletedMonthComparison(m.series || []);
      const target = cmp ? KPI_TARGETS[key][cmp.label] : null;
      const achievement = (cmp && target) ? (cmp.value / target) * 100 : null;
      html += `
        <div class="kpi-card" style="border-left:3px solid ${color};">
          <div class="kpi-top">
            <div class="kpi-label"><span class="kpi-dot" style="background:${color}"></span>${m.label} · ${cmp ? cmp.label : "-"}</div>
          </div>
          <div class="kpi-value-row">
            <div class="kpi-value">${cmp ? fmt(cmp.value) : "-"}<span class="unit">건</span></div>
            ${achievement !== null ? `<span class="kpi-delta ${achievement >= 100 ? "up" : "down"}">달성률 ${achievement.toFixed(0)}%</span>` : ""}
          </div>
          <div class="kpi-sub">목표 ${target ? fmt(target) : "-"}건 · 전월비 ${cmp && cmp.delta !== null ? (cmp.delta >= 0 ? "▲" : "▼") + Math.abs(cmp.delta).toFixed(1) + "%" : "-"}</div>
        </div>`;
    });
    return html;
  }

  function computeYtdSummary(rows) {
    const elapsed = rows.filter(r => r.hasActual);
    const cumulativeTarget = elapsed.reduce((a, r) => a + r.target, 0);
    const cumulativeActual = elapsed.reduce((a, r) => a + (r.actual || 0), 0);
    const achievement = cumulativeTarget > 0 ? (cumulativeActual / cumulativeTarget) * 100 : null;
    const annualTarget = rows.reduce((a, r) => a + r.target, 0);
    return { cumulativeTarget, cumulativeActual, achievement, annualTarget, monthsElapsed: elapsed.length };
  }

  /* ================= 일별 트래킹 탭 ================= */

  function sumRangeInclusive(series, startDate, endDate) {
    return series.filter(p => p.date >= startDate && p.date <= endDate)
                 .reduce((a, p) => a + p.value, 0);
  }

  function computeMonthToDateKpi(series) {
    if (!series || series.length === 0) return { current: null, delta: null, monthLabel: "" };
    const latest = series[series.length - 1].date;
    const [y, m, d] = latest.split("-").map(Number);

    const startCur = `${y}-${String(m).padStart(2, "0")}-01`;
    const current = sumRangeInclusive(series, startCur, latest);

    let prevYear = y, prevMonth = m - 1;
    if (prevMonth === 0) { prevMonth = 12; prevYear -= 1; }
    const daysInPrevMonth = new Date(prevYear, prevMonth, 0).getDate();
    const prevDay = Math.min(d, daysInPrevMonth);
    const startPrev = `${prevYear}-${String(prevMonth).padStart(2, "0")}-01`;
    const endPrev = `${prevYear}-${String(prevMonth).padStart(2, "0")}-${String(prevDay).padStart(2, "0")}`;
    const prev = sumRangeInclusive(series, startPrev, endPrev);

    let delta = null;
    if (prev > 0) delta = ((current - prev) / prev) * 100;
    return { current, prev, delta, monthLabel: `${m}월`, prevMonthLabel: `${prevMonth}월`, startCur, latestDate: latest };
  }

  function computeDayOverDayDelta(series) {
    if (!series || series.length < 2) return null;
    const lastVal = series[series.length - 1].value;
    const prevVal = series[series.length - 2].value;
    if (prevVal === 0) return null;
    return { delta: ((lastVal - prevVal) / prevVal) * 100, lastVal, prevVal, prevDate: series[series.length - 2].date };
  }

  function renderDailyKpiCards() {
    let html = "";
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (!m) return;
      const color = COLORS[key];
      const { current, monthLabel, startCur, latestDate } = computeMonthToDateKpi(m.series);
      const dod = computeDayOverDayDelta(m.series);
      const lastVal = dod ? dod.lastVal : (m.series && m.series.length ? m.series[m.series.length - 1].value : null);
      const sparkPoints = (m.series || []).filter(p => !startCur || p.date >= startCur);
      const sparkSeries = sparkPoints.map(p => p.value);
      const stats = computeSparkStats(sparkPoints);
      html += `
        <div class="kpi-card" style="border-left:3px solid ${color};">
          <div class="kpi-top">
            <div class="kpi-label"><span class="kpi-dot" style="background:${color}"></span>${m.label}</div>

          ${sparkPoints.length ? `<div style="display:flex; justify-content:space-between; font-size:10px; color:var(--ink-faint); margin-top:2px;"><span>${sparkPoints[0].date.slice(5)}</span><span>${sparkPoints[sparkPoints.length - 1].date.slice(5)}</span></div>` : ""}
          <div class="kpi-sub">${latestDate ? latestDate.slice(5) : "-"} 기준${dod ? ` · 전일(${dod.prevDate.slice(5)}) ${fmt(dod.prevVal)}건 대비` : ""}</div>
          <div class="kpi-sub" style="margin-top:2px;">${monthLabel} 누적 ${fmt(current)}건</div>
          ${stats ? `<div class="kpi-sub" style="margin-top:2px;">최고 ${fmt(stats.maxP.value)}건(${stats.maxP.date.slice(5)}) · 최저 ${fmt(stats.minP.value)}건(${stats.minP.date.slice(5)})</div>` : ""}        </div>`;
    });
    return html;
  }

  function renderDailyTrendChart() {
    const ctx = document.getElementById("dailyTrendChart");
    if (!ctx) return;
    if (dailyChartInstance) { dailyChartInstance.destroy(); dailyChartInstance = null; }

    const perMetric = {};

        const agg = aggregateSeries(m.series, "day");
        perMetric[key] = agg;
        agg.forEach(p => allKeys.add(p.key));
      }
    });
    const sortedKeys = Array.from(allKeys).sort();
    if (sortedKeys.length === 0) return;
    const labelMap = {};
    METRIC_ORDER.forEach(key => (perMetric[key] || []).forEach(p => { labelMap[p.key] = p.label; }));
    const labels = sortedKeys.map(k => labelMap[k] || k);

    const datasets = METRIC_ORDER.filter(k => perMetric[k]).map(key => {
      const valueByKey = {};
      perMetric[key].forEach(p => { valueByKey[p.key] = p.value; });
      const pos = LABEL_POS[key] || { align: "top", anchor: "end" };
      return {
        label: METRICS_DATA[key].label,
        data: sortedKeys.map(k => valueByKey[k] !== undefined ? valueByKey[k] : null),
        borderColor: COLORS[key],

        pointBackgroundColor: COLORS[key],

    dailyChartInstance = new Chart(ctx, {

            formatter: (v, ctx) => {
              if (v === null) return "";
              const i = ctx.dataIndex, len = ctx.dataset.data.length;
              if (i % 2 === 0 || i === len - 1) return Math.round(v).toLocaleString("ko-KR");
              return "";

          y: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },

  }

  function getMonthKeyFromDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  }

  function aggregateDailyStoreForMonth(dailyTotals, monthKey) {
    const totals = {};
    Object.keys(dailyTotals || {}).forEach(date => {
      if (date.startsWith(monthKey)) {
        Object.entries(dailyTotals[date]).forEach(([name, v]) => {
          totals[name] = (totals[name] || 0) + v;
        });
      }
    });
    return totals;
  }

  function getAugmentedMonthlyTotals(monthlyTotals, dailyTotals) {
    const months = getSortedMonths(monthlyTotals);
    const curMonthKey = getMonthKeyFromDate(new Date());
    if (months.includes(curMonthKey)) return monthlyTotals;
    if (dailyTotals && Object.keys(dailyTotals).some(d => d.startsWith(curMonthKey))) {
      return { ...monthlyTotals, [curMonthKey]: aggregateDailyStoreForMonth(dailyTotals, curMonthKey) };
    }
    return monthlyTotals;
  }

  function getCurPrevMonthStoreData(monthlyTotals, dailyTotals) {
    const months = getSortedMonths(monthlyTotals);
    const today = new Date();
    const curMonthKey = getMonthKeyFromDate(today);
    const dayOfMonth = today.getDate();
    const curMonthHasDailyData = dailyTotals && Object.keys(dailyTotals).some(d => d.startsWith(curMonthKey));
    let cur, prev, curLabel, prevLabel, usingFallback = false;

    if (months.includes(curMonthKey)) {
      const idx = months.indexOf(curMonthKey);
      curLabel = curMonthKey;
      cur = monthlyTotals[curMonthKey];
      prevLabel = idx > 0 ? months[idx - 1] : null;
      prev = prevLabel ? monthlyTotals[prevLabel] : {};
    } else if (curMonthHasDailyData && dayOfMonth >= 5) {
      // 이번 달이 최소 5일 이상 쌓였을 때만 진행중인 달로 비교 (그 전엔 완료된 두 달 비교가 더 정확함)
      curLabel = curMonthKey;
      cur = aggregateDailyStoreForMonth(dailyTotals, curMonthKey);
      prevLabel = months.length ? months[months.length - 1] : null;
      prev = prevLabel ? monthlyTotals[prevLabel] : {};
      usingFallback = true;
    } else if (months.length >= 2) {
      prevLabel = months[months.length - 2];
      curLabel = months[months.length - 1];
      prev = monthlyTotals[prevLabel];
      cur = monthlyTotals[curLabel];
    } else if (curMonthHasDailyData) {
      curLabel = curMonthKey;
      cur = aggregateDailyStoreForMonth(dailyTotals, curMonthKey);
      prevLabel = months.length ? months[months.length - 1] : null;
      prev = prevLabel ? monthlyTotals[prevLabel] : {};
      usingFallback = true;
    } else if (months.length === 1) {
      curLabel = months[0];
      cur = monthlyTotals[curLabel];
      prevLabel = null;
      prev = {};
    } else {
      return null;
    }
    return { curLabel, prevLabel, cur: cur || {}, prev: prev || {}, usingFallback };
  }

  function aggregateDailyStoreForMonthUpTo(dailyTotals, monthKey, dayCutoff) {
    const totals = {};
    Object.keys(dailyTotals || {}).forEach(date => {
      if (date.startsWith(monthKey)) {
        const day = parseInt(date.slice(8, 10), 10);
        if (day <= dayCutoff) {
          Object.entries(dailyTotals[date]).forEach(([name, v]) => {
            totals[name] = (totals[name] || 0) + v;
          });
        }
      }
    });
    return totals;
  }

  function getSameDateCutoffStoreData(dailyTotals) {
    const today = new Date();
    const dayCutoff = today.getDate();
    const curMonthKey = getMonthKeyFromDate(today);
    const curMonthNum = today.getMonth() + 1;
    let py = today.getFullYear(), pm = curMonthNum - 1;
    if (pm === 0) { pm = 12; py -= 1; }
    const prevMonthKey = `${py}-${String(pm).padStart(2, "0")}`;
    const daysInPrevMonth = new Date(py, pm, 0).getDate();
    const prevCutoff = Math.min(dayCutoff, daysInPrevMonth);

    const cur = aggregateDailyStoreForMonthUpTo(dailyTotals, curMonthKey, dayCutoff);
    const prev = aggregateDailyStoreForMonthUpTo(dailyTotals, prevMonthKey, prevCutoff);
    return { curLabel: `${curMonthKey}(1~${dayCutoff}일)`, prevLabel: `${prevMonthKey}(1~${prevCutoff}일)`, cur, prev };
  }

  function computeMonthlyStoreRanking(cur, prev) {
    const curSorted = Object.entries(cur).sort((a, b) => b[1] - a[1]);
    const prevSorted = Object.entries(prev).sort((a, b) => b[1] - a[1]);
    const prevRank = {};
    prevSorted.forEach(([name], i) => { prevRank[name] = i + 1; });

    return curSorted.slice(0, 20).map(([name, val], i) => {
      const rank = i + 1;
      const pRank = prevRank[name];
      const change = pRank === undefined ? "new" : pRank - rank;
      return { rank, name, val, pRank, change };
    });
  }

  function getLastTwoCompleteMonths(monthlyTotals) {
    const months = getSortedMonths(monthlyTotals);
    if (months.length === 0) return null;
    if (months.length === 1) {
      return { curLabel: months[0], prevLabel: null, cur: monthlyTotals[months[0]], prev: {} };
    }
    const prevLabel = months[months.length - 2];
    const curLabel = months[months.length - 1];
    return { curLabel, prevLabel, cur: monthlyTotals[curLabel], prev: monthlyTotals[prevLabel] };
  }

  function renderStoreRankingInto(containerId, monthData, note) {
    const area = document.getElementById(containerId);

      return;
    }
    const { curLabel, prevLabel, cur, prev } = monthData;
    const ranking = computeMonthlyStoreRanking(cur || {}, prev || {});

    function changeCell(item) {
      if (item.change === "new") return `<span style="color:var(--accent); font-weight:600;">NEW</span>`;
      if (item.change > 0) return `<span style="color:var(--good);">▲ ${item.change}</span>`;
      if (item.change < 0) return `<span style="color:var(--bad);">▼ ${Math.abs(item.change)}</span>`;
      return `<span style="color:var(--ink-faint);">–</span>`;
    }

    area.innerHTML = `
      <div class="section-head">
        <h2>매장 방문자수 TOP 20 (${curLabel}${prevLabel ? `, ${prevLabel} 대비 순위 변화` : ""})</h2>
      </div>
      ${note ? `<div class="empty-note" style="text-align:left; padding:0 0 10px;">${note}</div>` : ""}
      <table class="rank-table">
        <thead><tr><th>순위</th><th>매장</th><th style="text-align:right">방문자수</th><th style="text-align:right">순위 변화</th></tr></thead>
        <tbody>
          ${ranking.map(item => `
            <tr>
              <td class="rank-num">${String(item.rank).padStart(2, "0")}</td>

              <td class="rank-val">${changeCell(item)}</td>
            </tr>`).join("")}
        </tbody>
      </table>`;
  }

  function computeStoreChangeFromPair(cur, prev) {
    const allNames = new Set([...Object.keys(cur || {}), ...Object.keys(prev || {})]);
    const deltas = [];
    allNames.forEach(name => {
      const c = (cur || {})[name] || 0;
      const p = (prev || {})[name] || 0;
      deltas.push([name, c, p, c - p]);
    });
    const sorted = [...deltas].sort((a, b) => b[3] - a[3]);
    return {
      increases: sorted.filter(d => d[3] > 0).slice(0, 10),
      decreases: sorted.filter(d => d[3] < 0).slice(-10).reverse(),
    };
  }

  function renderStoreChangeInto(containerId, monthData, note) {
    const area = document.getElementById(containerId);
    if (!monthData) {
      area.innerHTML = `
        <div class="section-head"><h2>제휴처 방문자 증감 (TOP 10)</h2></div>
        <div class="empty-note">비교할 수 있는 데이터가 아직 없습니다.</div>`;
      return;
    }
    const { curLabel, prevLabel, cur, prev } = monthData;
    const { increases, decreases } = computeStoreChangeFromPair(cur, prev);

    function rows(list, sign) {

  }

  function computeWeekdayAvgFromSeries(series) {
    const weekdayNames = ["일", "월", "화", "수", "목", "금", "토"];
    const sums = new Array(7).fill(0);
    const counts = new Array(7).fill(0);
    (series || []).forEach(p => {
      const wd = new Date(p.date + "T00:00:00").getDay();
      sums[wd] += p.value;
      counts[wd] += 1;
    });
    const avgs = sums.map((s, i) => counts[i] ? s / counts[i] : 0);
    let bestWd = 0, worstWd = 0;
    avgs.forEach((v, i) => {
      if (v > avgs[bestWd]) bestWd = i;
      if (counts[i] > 0 && (counts[worstWd] === 0 || v < avgs[worstWd])) worstWd = i;
    });
    return { weekdayNames, avgs, bestWd, worstWd, hasEnough: series && series.length >= 14 };
  }

  function avgOfSeries(series) {
    return series && series.length ? series.reduce((a, p) => a + p.value, 0) / series.length : null;
  }

  function renderDailyInsights() {
    const parts = [];
    const trendBits = [];
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (!m || !m.series || !m.series.length) return;
      const last7 = m.series.slice(-7);
      const prev7 = m.series.slice(-14, -7);
      const last7Avg = avgOfSeries(last7);
      const prev7Avg = avgOfSeries(prev7);
      if (last7Avg === null) return;
      let pctStr = "";
      if (prev7Avg && prev7Avg > 0) {
        const pct = ((last7Avg - prev7Avg) / prev7Avg) * 100;
        const up = pct >= 0;
        pctStr = ` <span style="color:${up ? "var(--good)" : "var(--bad)"}; font-weight:600;">(${up ? "▲" : "▼"}${Math.abs(pct).toFixed(1)}%)</span>`;
      }
      trendBits.push(`${m.label} ${fmt(last7Avg)}건${pctStr}`);
    });
    if (trendBits.length) {
      parts.push(`최근 7일 평균은 ${trendBits.join(" · ")} — 전주 대비 변화예요`);
    }

    const uvSeries = METRICS_DATA.uv && METRICS_DATA.uv.series;
    const wd = computeWeekdayAvgFromSeries(uvSeries);
    if (wd.hasEnough) {
      parts.push(`UV 기준 <b>${wd.weekdayNames[wd.bestWd]}요일</b>에 방문자가 가장 많고 (평균 ${fmt(wd.avgs[wd.bestWd])}건), <b>${wd.weekdayNames[wd.worstWd]}요일</b>이 가장 적어요 (평균 ${fmt(wd.avgs[wd.worstWd])}건)`);
    }

    if (METRICS_DATA.uv && METRICS_DATA.benefit_claims) {
      const uvLast7 = avgOfSeries((METRICS_DATA.uv.series || []).slice(-7));
      const benefitLast7 = avgOfSeries((METRICS_DATA.benefit_claims.series || []).slice(-7));
      const uvPrev7 = avgOfSeries((METRICS_DATA.uv.series || []).slice(-14, -7));
      const benefitPrev7 = avgOfSeries((METRICS_DATA.benefit_claims.series || []).slice(-14, -7));
      if (uvLast7 && benefitLast7 !== null) {
        const convNow = (benefitLast7 / uvLast7) * 100;
        let cmpStr = "";
        if (uvPrev7 && benefitPrev7 !== null && uvPrev7 > 0) {
          const convPrev = (benefitPrev7 / uvPrev7) * 100;
          const diff = convNow - convPrev;
          const up = diff >= 0;
          cmpStr = ` (지난주 ${convPrev.toFixed(1)}% 대비 <span style="color:${up ? "var(--good)" : "var(--bad)"}; font-weight:600;">${up ? "▲" : "▼"}${Math.abs(diff).toFixed(1)}%p</span>)`;
        }
        parts.push(`혜택받기 전환율(UV 대비)은 최근 7일 평균 <b>${convNow.toFixed(1)}%</b>예요${cmpStr}`);
      }
    }

    // 이상치 감지: 최근 7일 중 30일 평균 대비 40% 이상 벗어난 날
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (!m || !m.series || m.series.length < 14) return;
      const recent30 = m.series.slice(-30);
      const avg30 = avgOfSeries(recent30);
      if (!avg30) return;
      const last7 = recent30.slice(-7);
      const anomalies = last7.filter(p => Math.abs(p.value - avg30) / avg30 > 0.4);
      if (anomalies.length) {
        const a = anomalies.sort((x, y) => Math.abs(y.value - avg30) - Math.abs(x.value - avg30))[0];
        const up = a.value >= avg30;
        parts.push(`${m.label}는 <b>${a.date.slice(5)}</b>에 ${fmt(a.value)}건으로, 최근 30일 평균(${fmt(avg30)}건) 대비 <span style="color:${up ? "var(--good)" : "var(--bad)"}; font-weight:600;">${up ? "크게 증가" : "크게 감소"}</span>했어요`);
      }
    });

    if (!parts.length) return "";
    return `<div class="section-card">
      <div class="section-head"><h2>📌 일별 트래킹 인사이트</h2></div>
      <ul style="margin:0; padding-left:18px; font-size:13.5px; line-height:1.9;">
        ${parts.map(t => `<li>${t}</li>`).join("")}
      </ul>
    </div>`;
  }

  /* ================= 주간 데이터 탭 ================= */

  function getMondayOf(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d.toISOString().slice(0, 10);
  }

  function aggregateWeekly(series) {
    if (!series || !series.length) return [];
    const buckets = {};
    series.forEach(p => {
      const wk = getMondayOf(p.date);
      buckets[wk] = (buckets[wk] || 0) + p.value;
    });
    return Object.keys(buckets).sort().map(k => ({ key: k, label: k.slice(5), value: buckets[k] }));
  }

  function computeWeekToDateKpi(series) {
    if (!series || !series.length) return { current: null, prev: null, delta: null, weekLabel: "", prevWeekLabel: "", latestDate: null };
    const latest = series[series.length - 1].date;
    const curMonday = getMondayOf(latest);
    const current = series.filter(p => p.date >= curMonday && p.date <= latest).reduce((a, p) => a + p.value, 0);

    const curMondayDate = new Date(curMonday + "T00:00:00");
    const prevMondayDate = new Date(curMondayDate);
    prevMondayDate.setDate(prevMondayDate.getDate() - 7);
    const prevMonday = prevMondayDate.toISOString().slice(0, 10);
    const daysElapsed = Math.floor((new Date(latest + "T00:00:00") - curMondayDate) / 86400000) + 1;
    const prevEndDate = new Date(prevMondayDate);
    prevEndDate.setDate(prevEndDate.getDate() + daysElapsed - 1);
    const prevEnd = prevEndDate.toISOString().slice(0, 10);
    const prev = series.filter(p => p.date >= prevMonday && p.date <= prevEnd).reduce((a, p) => a + p.value, 0);

    const delta = prev > 0 ? ((current - prev) / prev) * 100 : null;
    return {
      current, prev, delta,
      weekLabel: `${curMonday.slice(5)}~${latest.slice(5)}`,
      prevWeekLabel: `${prevMonday.slice(5)}~${prevEnd.slice(5)}`,
      latestDate: latest,
    };
  }

  function aggregateDailyStoreForRange(dailyTotals, startDate, endDate) {
    const totals = {};
    Object.keys(dailyTotals || {}).forEach(date => {
      if (date >= startDate && date <= endDate) {
        Object.entries(dailyTotals[date]).forEach(([name, v]) => {
          totals[name] = (totals[name] || 0) + v;
        });
      }
    });
    return totals;
  }

  function getWeekOverWeekStoreData(dailyTotals) {
    const dates = getSortedDates(dailyTotals);
    if (!dates.length) return null;
    const latest = dates[dates.length - 1];
    const curMonday = getMondayOf(latest);
    const curMondayDate = new Date(curMonday + "T00:00:00");
    const prevMondayDate = new Date(curMondayDate);
    prevMondayDate.setDate(prevMondayDate.getDate() - 7);
    const prevMonday = prevMondayDate.toISOString().slice(0, 10);
    const daysElapsed = Math.floor((new Date(latest + "T00:00:00") - curMondayDate) / 86400000) + 1;
    const prevEndDate = new Date(prevMondayDate);
    prevEndDate.setDate(prevEndDate.getDate() + daysElapsed - 1);
    const prevEnd = prevEndDate.toISOString().slice(0, 10);

    const cur = aggregateDailyStoreForRange(dailyTotals, curMonday, latest);
    const prev = aggregateDailyStoreForRange(dailyTotals, prevMonday, prevEnd);
    return {
      curLabel: `${curMonday.slice(5)}~${latest.slice(5)}`,
      prevLabel: `${prevMonday.slice(5)}~${prevEnd.slice(5)}`,
      cur, prev,
    };
  }

  function renderWeeklyKpiCards() {
    let html = "";
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (!m) return;
      const color = COLORS[key];

          ${weekly.length ? `<div style="display:flex; justify-content:space-between; font-size:10px; color:var(--ink-faint); margin-top:2px;"><span>${weekly[0].label}</span><span>${weekly[weekly.length - 1].label}</span></div>` : ""}
          <div class="kpi-sub">이번 주(${weekLabel}) 누적 · 전주 동기간(${prevWeekLabel})比</div>
        </div>`;
    });
    return html;
  }

  function renderWeeklyTrendChart() {
    const ctx = document.getElementById("weeklyTrendChart");
    if (!ctx) return;
    if (weeklyChartInstance) { weeklyChartInstance.destroy(); weeklyChartInstance = null; }

    const perMetric = {};
    let allKeys = new Set();
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (m && m.series && m.series.length) {
        const agg = aggregateWeekly(m.series).slice(-16);
        perMetric[key] = agg;
        agg.forEach(p => allKeys.add(p.key));
      }
    });
    const sortedKeys = Array.from(allKeys).sort();
    if (!sortedKeys.length) return;
    const labelMap = {};
    METRIC_ORDER.forEach(key => (perMetric[key] || []).forEach(p => { labelMap[p.key] = p.label; }));
    const labels = sortedKeys.map(k => labelMap[k] || k);

    const datasets = METRIC_ORDER.filter(k => perMetric[k]).map(key => {
      const valueByKey = {};
      perMetric[key].forEach(p => { valueByKey[p.key] = p.value; });
      const pos = LABEL_POS[key] || { align: "top", anchor: "end" };
      return {
        label: METRICS_DATA[key].label,
        data: sortedKeys.map(k => valueByKey[k] !== undefined ? valueByKey[k] : null),
        borderColor: COLORS[key],
        backgroundColor: COLORS[key],
        tension: 0.3,
        pointRadius: 3,
        pointBackgroundColor: COLORS[key],
        borderWidth: 2,
        spanGaps: true,
        datalabels: { align: pos.align, anchor: pos.anchor, offset: 5 },
      };
    });

    weeklyChartInstance = new Chart(ctx, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          datalabels: {
            font: { size: 10, family: "'IBM Plex Mono', monospace", weight: 600 },
            color: (c) => c.dataset.borderColor,
            backgroundColor: "rgba(255,255,255,0.85)",
            borderRadius: 3,
            padding: { top: 1, bottom: 1, left: 3, right: 3 },
            formatter: (v) => v === null ? "" : Math.round(v).toLocaleString("ko-KR"),
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#9ca3af", font: { size: 11 } } },
          y: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },
        },
      },
    });
  }

  function renderWeeklyInsights() {
    const parts = [];
    const bits = [];
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (!m || !m.series || !m.series.length) return;
      const { current, delta } = computeWeekToDateKpi(m.series);
      if (current === null) return;
      let pctStr = "";
      if (delta !== null) {
        const up = delta >= 0;
        pctStr = ` <span style="color:${up ? "var(--good)" : "var(--bad)"}; font-weight:600;">(${up ? "▲" : "▼"}${Math.abs(delta).toFixed(1)}%)</span>`;
      }
      bits.push(`${m.label} ${fmt(current)}건${pctStr}`);
    });
    if (bits.length) parts.push(`이번 주 누적은 ${bits.join(" · ")} — 전주 동기간 대비 변화예요`);

    const uvSeries = METRICS_DATA.uv && METRICS_DATA.uv.series;
    const wd = computeWeekdayAvgFromSeries(uvSeries);
    if (wd.hasEnough) {
      parts.push(`UV 기준 <b>${wd.weekdayNames[wd.bestWd]}요일</b>에 방문자가 가장 많고 (평균 ${fmt(wd.avgs[wd.bestWd])}건), <b>${wd.weekdayNames[wd.worstWd]}요일</b>이 가장 적어요 (평균 ${fmt(wd.avgs[wd.worstWd])}건)`);
    }

    if (METRICS_DATA.uv && METRICS_DATA.benefit_claims) {
      const uvW = computeWeekToDateKpi(METRICS_DATA.uv.series || []);
      const benefitW = computeWeekToDateKpi(METRICS_DATA.benefit_claims.series || []);
      if (uvW.current && benefitW.current !== null && uvW.current > 0) {
        const convNow = (benefitW.current / uvW.current) * 100;
        let cmpStr = "";
        if (uvW.prev > 0) {
          const convPrev = (benefitW.prev / uvW.prev) * 100;
          const diff = convNow - convPrev;

          cmpStr = ` (전주 동기간 ${convPrev.toFixed(1)}% 대비 <span style="color:${up ? "var(--good)" : "var(--bad)"}; font-weight:600;">${up ? "▲" : "▼"}${Math.abs(diff).toFixed(1)}%p</span>)`;
        }
        parts.push(`혜택받기 전환율(UV 대비)은 이번 주 누적 기준 <b>${convNow.toFixed(1)}%</b>예요${cmpStr}`);
      }
    }

    if (!parts.length) return "";
    return `<div class="section-card">

  /* ================= 월간 데이터 탭 ================= */

  function monthOverMonthDelta(agg) {
    if (agg.length < 2) return null;
    const cur = agg[agg.length - 1].value;
    const prev = agg[agg.length - 2].value;
    if (prev === 0) return null;
    return ((cur - prev) / prev) * 100;
  }

  function renderMonthlyTrendChart() {
    const ctx = document.getElementById("monthlyTrendChart");
    if (!ctx) return;
    if (monthlyChartInstance) { monthlyChartInstance.destroy(); monthlyChartInstance = null; }

    const perMetric = {};
    let allKeys = new Set();
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (m && m.series && m.series.length) {
        const agg = aggregateSeries(m.series, monthlyPeriod);
        perMetric[key] = agg;
        agg.forEach(p => allKeys.add(p.key));
      }
    });
    const sortedKeys = Array.from(allKeys).sort();
    if (sortedKeys.length === 0) return;
    const labelMap = {};
    METRIC_ORDER.forEach(key => (perMetric[key] || []).forEach(p => { labelMap[p.key] = p.label; }));
    const labels = sortedKeys.map(k => labelMap[k] || k);

    const datasets = METRIC_ORDER.filter(k => perMetric[k]).map(key => {
      const valueByKey = {};
      perMetric[key].forEach(p => { valueByKey[p.key] = p.value; });
      const pos = LABEL_POS[key] || { align: "top", anchor: "end" };
      return {
        label: METRICS_DATA[key].label,
        data: sortedKeys.map(k => valueByKey[k] !== undefined ? valueByKey[k] : null),
        borderColor: COLORS[key],
        backgroundColor: COLORS[key],
        tension: 0.3,
        pointRadius: 4,
        pointBackgroundColor: COLORS[key],
        borderWidth: 2,
        spanGaps: true,
        datalabels: { align: pos.align, anchor: pos.anchor, offset: 5 },
      };
    });

    monthlyChartInstance = new Chart(ctx, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          datalabels: {
            font: { size: 10.5, family: "'IBM Plex Mono', monospace", weight: 600 },
            color: (c) => c.dataset.borderColor,
            backgroundColor: "rgba(255,255,255,0.85)",
            borderRadius: 3,
            padding: { top: 1, bottom: 1, left: 3, right: 3 },
            formatter: (v) => v === null ? "" : Math.round(v).toLocaleString("ko-KR"),
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#9ca3af", font: { size: 11 } } },
          y: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },
        },
      },
    });
  }

  function renderMonthlyInsights() {
    const parts = [];
    const momBits = [];
    let bestGrowth = null;
    let monthLabel = "이번 달", prevMonthLabel = "전월", latestDateLabel = "";
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (!m || !m.series || !m.series.length) return;
      const { current, delta, monthLabel: ml, prevMonthLabel: pml, latestDate } = computeMonthToDateKpi(m.series);
      if (current === null) return;
      monthLabel = ml; prevMonthLabel = pml;
      if (latestDate) latestDateLabel = latestDate.slice(5);
      let pctStr = "";
      if (delta !== null) {
        const up = delta >= 0;
        pctStr = ` <span style="color:${up ? "var(--good)" : "var(--bad)"}; font-weight:600;">(${up ? "▲" : "▼"}${Math.abs(delta).toFixed(1)}%)</span>`;
        if (bestGrowth === null || delta > bestGrowth.delta) bestGrowth = { label: m.label, delta };
      }
      momBits.push(`${m.label} ${fmt(current)}건${pctStr}`);
    });
    if (momBits.length) {
      parts.push(`${monthLabel} 누적(1일~${latestDateLabel})은 ${momBits.join(" · ")} — ${prevMonthLabel} 동일 기간 대비 변화예요`);
    }
    if (bestGrowth && bestGrowth.delta > 0) {
      parts.push(`${monthLabel} 가장 크게 성장한 지표는 <b>${bestGrowth.label}</b>로, ${prevMonthLabel} 동기간 대비 <span style="color:var(--good); font-weight:600;">▲${bestGrowth.delta.toFixed(1)}%</span> 증가했어요`);
    }

    if (METRICS_DATA.uv && METRICS_DATA.benefit_claims) {
      const uvMtd = computeMonthToDateKpi(METRICS_DATA.uv.series || []);
      const benefitMtd = computeMonthToDateKpi(METRICS_DATA.benefit_claims.series || []);
      if (uvMtd.current !== null && benefitMtd.current !== null && uvMtd.current > 0) {
        const convNow = (benefitMtd.current / uvMtd.current) * 100;
        let cmpStr = "";
        if (uvMtd.prev > 0) {
          const convPrev = (benefitMtd.prev / uvMtd.prev) * 100;
          const diff = convNow - convPrev;
          const up = diff >= 0;
          cmpStr = ` (${prevMonthLabel} 동기간 ${convPrev.toFixed(1)}% 대비 <span style="color:${up ? "var(--good)" : "var(--bad)"}; font-weight:600;">${up ? "▲" : "▼"}${Math.abs(diff).toFixed(1)}%p</span>)`;
        }
        parts.push(`혜택받기 전환율(UV 대비)은 ${monthLabel} 누적 기준 <b>${convNow.toFixed(1)}%</b>예요${cmpStr}`);
      }
    }

    if (!parts.length) return "";
    return `<div class="section-card">
      <div class="section-head"><h2>📌 이번 달(${monthLabel}, 진행중) 인사이트</h2></div>
      <ul style="margin:0; padding-left:18px; font-size:13.5px; line-height:1.9;">
        ${parts.map(t => `<li>${t}</li>`).join("")}
      </ul>
    </div>`;
  }

  function getCompletedMonthComparison(series) {
    const agg = aggregateSeries(series, "month");
    if (!agg.length) return null;
    const curRealMonth = getMonthKeyFromDate(new Date());
    let idx = agg.length - 1;
    if (agg[idx].label === curRealMonth) idx -= 1;
    if (idx < 0) return null;
    const completed = agg[idx];
    const prev = idx > 0 ? agg[idx - 1] : null;
    const delta = (prev && prev.value > 0) ? ((completed.value - prev.value) / prev.value) * 100 : null;
    return {
      label: completed.label, value: completed.value,
      prevLabel: prev ? prev.label : null, prevValue: prev ? prev.value : null, delta,
    };
  }

  function renderCompletedMonthInsights() {
    const parts = [];
    const bits = [];
    let bestGrowth = null;
    let label = null, prevLabel = null;
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (!m || !m.series || !m.series.length) return;
      const cmp = getCompletedMonthComparison(m.series);
      if (!cmp) return;
      label = cmp.label; prevLabel = cmp.prevLabel;
      let pctStr = "";
      if (cmp.delta !== null) {
        const up = cmp.delta >= 0;
        pctStr = ` <span style="color:${up ? "var(--good)" : "var(--bad)"}; font-weight:600;">(${up ? "▲" : "▼"}${Math.abs(cmp.delta).toFixed(1)}%)</span>`;
        if (bestGrowth === null || cmp.delta > bestGrowth.delta) bestGrowth = { label: m.label, delta: cmp.delta };
      }
      bits.push(`${m.label} ${fmt(cmp.value)}건${pctStr}`);
    });
    if (!label) return "";
    parts.push(`<b>${label}</b> 전체 합계는 ${bits.join(" · ")} — ${prevLabel ? `${prevLabel} 대비 변화예요` : "이전 데이터가 없어 비교하지 못했어요"}`);
    if (bestGrowth && bestGrowth.delta > 0) {
      parts.push(`${label}에 가장 크게 성장한 지표는 <b>${bestGrowth.label}</b>로, ${prevLabel} 대비 <span style="color:var(--good); font-weight:600;">▲${bestGrowth.delta.toFixed(1)}%</span> 증가했어요`);
    }

    if (METRICS_DATA.uv && METRICS_DATA.benefit_claims) {
      const uvCmp = getCompletedMonthComparison(METRICS_DATA.uv.series || []);
      const benefitCmp = getCompletedMonthComparison(METRICS_DATA.benefit_claims.series || []);
      if (uvCmp && benefitCmp && uvCmp.value > 0) {
        const convNow = (benefitCmp.value / uvCmp.value) * 100;
        let cmpStr = "";
        if (uvCmp.prevValue > 0) {
          const convPrev = (benefitCmp.prevValue / uvCmp.prevValue) * 100;
          const diff = convNow - convPrev;
          const up = diff >= 0;
          cmpStr = ` (${prevLabel} ${convPrev.toFixed(1)}% 대비 <span style="color:${up ? "var(--good)" : "var(--bad)"}; font-weight:600;">${up ? "▲" : "▼"}${Math.abs(diff).toFixed(1)}%p</span>)`;
        }
        parts.push(`혜택받기 전환율(UV 대비)은 ${label} 기준 <b>${convNow.toFixed(1)}%</b>예요${cmpStr}`);
      }
    }

    parts.push(...renderStoreLevelInsights());

    // 종합 분석: 매장 이탈/성장이 전체 UV·혜택받기·직원확인 변화와 어느 정도 맞물리는지 연결
    const storeMetric = METRICS_DATA[STORE_KEY];
    if (storeMetric) {
      const monthlyTotals = storeMetric.monthly_totals || {};
      const monthData = getLastTwoCompleteMonths(monthlyTotals);
      const uvCmp = getCompletedMonthComparison(METRICS_DATA.uv ? METRICS_DATA.uv.series || [] : []);
      const benefitCmp = getCompletedMonthComparison(METRICS_DATA.benefit_claims ? METRICS_DATA.benefit_claims.series || [] : []);
      const staffCmp = getCompletedMonthComparison(METRICS_DATA.staff_verifications ? METRICS_DATA.staff_verifications.series || [] : []);

      if (monthData && monthData.prevLabel && uvCmp && uvCmp.delta !== null) {
        const brandChanges = computeBrandChanges(monthData.cur, monthData.prev);
        const churnBrands = brandChanges.filter(b => b.prev >= 20 && b.pct !== null && b.pct <= -70);
        const growthBrands = brandChanges.filter(b => b.prev >= 10 && b.pct !== null && b.pct > 30);

        function ratioText(metricLabel, cmp, churnAmount) {
          if (!cmp || cmp.delta === null || cmp.delta >= 0) return null;
          const declineAbs = cmp.prevValue - cmp.value;
          if (declineAbs <= 0) return null;
          const ratio = (churnAmount / declineAbs) * 100;
          if (ratio > 100) {
            return `${metricLabel} 감소분(${fmt(declineAbs)}건)의 약 <b>${ratio.toFixed(0)}%</b> (다른 매장 성장으로 일부 상쇄됨)`;
          }
          return `${metricLabel} 감소분(${fmt(declineAbs)}건)의 약 <b>${ratio.toFixed(0)}%</b>`;
        }

        if (churnBrands.length) {
          const totalChurnDecline = churnBrands.reduce((a, b) => a + (b.prev - b.cur), 0);
          const brandNames = churnBrands.map(b => b.brand).join("·");
          if (uvCmp.delta < 0) {
            const ratioBits = [
              ratioText("UV", uvCmp, totalChurnDecline),
              ratioText("혜택받기", benefitCmp, totalChurnDecline),
              ratioText("직원확인", staffCmp, totalChurnDecline),
            ].filter(Boolean);
            const ratioStr = ratioBits.length ? ratioBits.join(", ") : "일부";
            parts.unshift(`<b>${brandNames}</b> 매장군의 제휴 종료로 인한 방문 감소분(약 ${fmt(totalChurnDecline)}건)이, ${label} ${ratioStr}를 차지해요 — 이번 감소는 이 매장군 이탈 영향이 큰 것으로 보여요`);
          } else {
            parts.unshift(`<b>${brandNames}</b> 매장군이 제휴 종료로 이탈했지만, 다른 매장들의 성장 덕분에 ${label} 전체 UV는 오히려 <span style="color:var(--good); font-weight:600;">▲${uvCmp.delta.toFixed(1)}%</span> 증가했어요 — 이탈 영향이 상쇄된 것으로 보여요`);
          }
        } else if (growthBrands.length && uvCmp.delta > 0) {
          const top = growthBrands[0];
          parts.unshift(`<b>${top.brand}</b> 매장군의 성장(${prevLabel} 대비 ▲${top.pct.toFixed(0)}%)이, ${label} 전체 UV 증가(▲${uvCmp.delta.toFixed(1)}%)에 기여한 것으로 보여요`);
        }
      }
    }

    if (!parts.length) return "";
    return `<div class="section-card">
      <div class="section-head"><h2>📌 지난달(${label}) 종합 인사이트</h2></div>
      <ul style="margin:0; padding-left:18px; font-size:13.5px; line-height:1.9;">
        ${parts.map(t => `<li>${t}</li>`).join("")}
      </ul>
    </div>`;
  }

  function extractBrand(name) {
    return name.split(" ")[0];
  }

  function computeBrandChanges(cur, prev) {
    const brandCur = {}, brandPrev = {};
    const allNames = new Set([...Object.keys(cur || {}), ...Object.keys(prev || {})]);
    allNames.forEach(name => {
      const brand = extractBrand(name);
      brandCur[brand] = (brandCur[brand] || 0) + ((cur || {})[name] || 0);
      brandPrev[brand] = (brandPrev[brand] || 0) + ((prev || {})[name] || 0);
    });
    const brands = new Set([...Object.keys(brandCur), ...Object.keys(brandPrev)]);
    return Array.from(brands).map(b => {
      const c = brandCur[b] || 0;
      const p = brandPrev[b] || 0;
      const delta = c - p;
      const pct = p > 0 ? (delta / p) * 100 : null;
      return { brand: b, cur: c, prev: p, delta, pct };
    });
  }

  function renderStoreLevelInsights() {
    const storeMetric = METRICS_DATA[STORE_KEY];
    if (!storeMetric) return [];
    const monthlyTotals = storeMetric.monthly_totals || {};
    const monthData = getLastTwoCompleteMonths(monthlyTotals);
    if (!monthData || !monthData.prevLabel) return [];

    const bits = [];
    const brandChanges = computeBrandChanges(monthData.cur, monthData.prev);

    // 이탈 의심: 전월에 유의미한 규모(20건 이상)였다가 70% 이상 급감한 브랜드
    const churnBrands = brandChanges
      .filter(b => b.prev >= 20 && b.pct !== null && b.pct <= -70)
      .sort((a, b) => a.pct - b.pct);
    if (churnBrands.length) {
      const names = churnBrands.slice(0, 3).map(b =>
        `<b>${b.brand}</b>(${fmt(b.prev)}→${fmt(b.cur)}건, <span style="color:var(--bad); font-weight:600;">${b.pct.toFixed(0)}%</span>)`
      ).join(", ");
      bits.push(`${names} 매장군은 방문자가 급격히 줄었어요 — 제휴 종료 등 운영 변경 가능성이 있어요`);
    }

    // 급성장 브랜드
    const growthBrands = brandChanges
      .filter(b => b.prev >= 10 && b.pct !== null && b.pct > 30)
      .sort((a, b) => b.pct - a.pct);
    if (growthBrands.length) {
      const top = growthBrands[0];
      bits.push(`<b>${top.brand}</b> 매장군은 ${monthData.prevLabel} 대비 <span style="color:var(--good); font-weight:600;">▲${top.pct.toFixed(0)}%</span> 성장했어요 (${fmt(top.prev)}→${fmt(top.cur)}건)`);
    }

    // 개별 매장 중 완전히 이탈(전월 10건 이상 → 이번달 0건)
    const droppedStores = Object.entries(monthData.prev || {})
      .filter(([name, prevVal]) => prevVal >= 10 && !(monthData.cur || {})[name])
      .sort((a, b) => b[1] - a[1]);
    if (droppedStores.length) {
      const names = droppedStores.slice(0, 5).map(([name, val]) => `${name}(${fmt(val)}건)`).join(", ");
      bits.push(`${monthData.prevLabel}에는 방문 기록이 있었지만 ${monthData.curLabel}에는 방문이 없는 매장이 ${droppedStores.length}곳 있어요: ${names}${droppedStores.length > 5 ? " 외" : ""}`);
    }

    return bits;
  }

  function renderMonthlyTab() {
    const area = document.getElementById("monthly-area");
    const curMonthKey = getMonthKeyFromDate(new Date());
    const curMonthNum = parseInt(curMonthKey.split("-")[1], 10);
    let completedLabel = "전월";
    if (METRICS_DATA.uv && METRICS_DATA.uv.series && METRICS_DATA.uv.series.length) {
      const cmp = getCompletedMonthComparison(METRICS_DATA.uv.series);
      if (cmp) completedLabel = cmp.label;
    }

    area.innerHTML = `
      <div class="section-card">
        <div class="section-head">
          <h2>기간별 추이</h2>
          <div style="display:flex; align-items:center; gap:16px;">
            <div class="legend">
              ${METRIC_ORDER.filter(k => METRICS_DATA[k]).map(k => `
                <span class="legend-item"><span class="legend-dot" style="background:${COLORS[k]}"></span>${METRICS_DATA[k].label}</span>
              `).join("")}
            </div>
            <div class="segmented" id="monthly-period-toggle">
              <button class="active" data-period="month">월별</button>
              <button data-period="quarter">분기별</button>
            </div>
          </div>
        </div>
        <div class="trend-chart-wrap tall"><canvas id="monthlyTrendChart"></canvas></div>
      </div>

      <div class="sub-tab-nav" id="monthly-subtab-nav">
        <button class="active" data-subtab="cur">📆 이번 달 현황 (${curMonthNum}월, 진행중)</button>
        <button data-subtab="prev">📅 전월 종합 리뷰 (${completedLabel})</button>
      </div>

      <div class="sub-tab-panel active" id="monthly-subtab-cur">
        ${renderMonthlyInsights()}
        <div class="kpi-grid">${renderMonthlyKpiCards()}</div>

        <div class="section-card" id="current-store-change-area"></div>

      <div class="sub-tab-panel" id="monthly-subtab-prev">
        ${renderCompletedMonthInsights()}
        <div class="section-card" id="monthly-store-ranking-area"></div>
        <div class="section-card" id="monthly-store-change-area"></div>
      </div>`;

    renderCurrentStoreRankingSection();

    document.querySelectorAll("#monthly-subtab-nav button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#monthly-subtab-nav button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll("#tab-monthly .sub-tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`monthly-subtab-${btn.dataset.subtab}`).classList.add("active");
      });

      btn.addEventListener("click", () => {
        document.querySelectorAll("#monthly-period-toggle button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        monthlyPeriod = btn.dataset.period;
        renderMonthlyTrendChart();
      });
    });
  }

  /* ================= 제휴처별 데이터 탭 ================= */

  let dailyStoreDate = null;

  function getSortedDates(dailyTotals) {
    return Object.keys(dailyTotals || {}).sort();
  }

  function computeDailyStoreDelta(dailyTotals, dates, currentDate) {
    const idx = dates.indexOf(currentDate);
    if (idx <= 0) return { surges: [], drops: [] };
    const prevDate = dates[idx - 1];
    const cur = dailyTotals[currentDate] || {};
    const prev = dailyTotals[prevDate] || {};
    const deltas = [];
    Object.keys(cur).forEach(name => {
      if (prev[name] !== undefined) {
        deltas.push([name, cur[name], prev[name], cur[name] - prev[name]]);
      }
    });
    const sorted = [...deltas].sort((a, b) => b[3] - a[3]);
    const surges = sorted.filter(d => d[3] > 0).slice(0, 5);
    const drops = sorted.filter(d => d[3] < 0).slice(-5).reverse();
    return { surges, drops, prevDate };
  }

  function getSortedMonths(monthlyTotals) {
    return Object.keys(monthlyTotals || {}).sort();
  }

  let partnerCharts = {};
  function destroyPartnerCharts() {
    Object.values(partnerCharts).forEach(c => c && c.destroy());
    partnerCharts = {};
  }

  function getStoreDailySeries(dailyTotals, storeName) {
    return getSortedDates(dailyTotals).map(d => ({ date: d, value: (dailyTotals[d] || {})[storeName] || 0 }));
  }

  function getStoreMonthlySeries(monthlyTotals, storeName) {
    return getSortedMonths(monthlyTotals).map(m => ({ month: m, value: (monthlyTotals[m] || {})[storeName] || 0 }));
  }

  function getStoreMonthlyRankSeries(monthlyTotals, storeName) {
    return getSortedMonths(monthlyTotals).map(m => {
      const bucket = monthlyTotals[m] || {};
      const sorted = Object.entries(bucket).sort((a, b) => b[1] - a[1]);
      const idx = sorted.findIndex(([n]) => n === storeName);
      return { month: m, rank: idx >= 0 ? idx + 1 : null, total: sorted.length };
    });
  }

  function computeStoreRepeatRatio(dsRawRows, labelKey, metricKey, storeName) {
    let sessionSum = 0, memberSum = 0;
    dsRawRows.forEach(r => {
      if (r[labelKey] === storeName) {
        memberSum += Number(r[metricKey]) || 0;
        const sessionKey = Object.keys(r).find(k => k.includes("세션수"));
        if (sessionKey) sessionSum += Number(r[sessionKey]) || 0;
      }
    });
    return memberSum > 0 ? sessionSum / memberSum : null;
  }

  function renderPartnerDetail(storeName) {
    destroyPartnerCharts();
    const detailArea = document.getElementById("partner-detail-area");
    const storeMetric = METRICS_DATA[STORE_KEY];
    const dsMetric = METRICS_DATA["daily_store"];
    const monthlyTotals = storeMetric.monthly_totals || {};
    const dailyTotals = (dsMetric && dsMetric.daily_totals) || {};
    const dsRawRows = (dsMetric && dsMetric.data) || [];
    const dsLabelKey = dsMetric ? dsMetric.label_key : "place_name";
    const dsMetricKey = dsMetric ? dsMetric.metric_key : null;

    const monthData = getCurPrevMonthStoreData(monthlyTotals, dailyTotals);
    let curVal = 0, prevVal = 0, curLabel = "-", prevLabel = null, curRank = null, prevRank = null, totalStores = 0;
    if (monthData) {
      curLabel = monthData.curLabel;
      prevLabel = monthData.prevLabel;
      curVal = monthData.cur[storeName] || 0;
      prevVal = monthData.prev[storeName] || 0;
      const curSorted = Object.entries(monthData.cur).sort((a, b) => b[1] - a[1]);
      totalStores = curSorted.length;
      const ci = curSorted.findIndex(([n]) => n === storeName);
      curRank = ci >= 0 ? ci + 1 : null;
      const prevSorted = Object.entries(monthData.prev).sort((a, b) => b[1] - a[1]);
      const pi = prevSorted.findIndex(([n]) => n === storeName);
      prevRank = pi >= 0 ? pi + 1 : null;
    }
    const monthDelta = prevVal > 0 ? ((curVal - prevVal) / prevVal) * 100 : null;
    const rankChange = (curRank !== null && prevRank !== null) ? prevRank - curRank : null;

    const dailySeries = getStoreDailySeries(dailyTotals, storeName);
    const totalAllTime = dailySeries.reduce((a, p) => a + p.value, 0);
    const recentDaily = dailySeries.slice(-60);
    const dailyAvg = recentDaily.length
      ? recentDaily.reduce((a, p) => a + p.value, 0) / recentDaily.length
      : null;

    const benefitMonthlyTotals = getAugmentedMonthlyTotals(storeMetric.benefit_monthly_totals || {}, dailyTotals);
    const monthlySeries = getStoreMonthlySeries(benefitMonthlyTotals, storeName);
    const rankSeries = getStoreMonthlyRankSeries(benefitMonthlyTotals, storeName);
    const repeatRatio = computeStoreRepeatRatio(dsRawRows, dsLabelKey, dsMetricKey, storeName);

    // 요일별 평균 방문자 (전체 기간 기준)
    const weekdayNames = ["일", "월", "화", "수", "목", "금", "토"];
    const wdSums = new Array(7).fill(0);
    const wdCounts = new Array(7).fill(0);
    dailySeries.forEach(p => {
      const wd = new Date(p.date + "T00:00:00").getDay();
      wdSums[wd] += p.value;
      wdCounts[wd] += 1;
    });
    const wdAvgs = wdSums.map((s, i) => wdCounts[i] ? s / wdCounts[i] : 0);
    let bestWd = 0, worstWd = 0;
    wdAvgs.forEach((v, i) => {
      if (v > wdAvgs[bestWd]) bestWd = i;
      if (wdCounts[i] > 0 && (wdCounts[worstWd] === 0 || v < wdAvgs[worstWd])) worstWd = i;
    });
    const hasWeekdayData = dailySeries.length >= 14;

    // 최근 추세 (최근 7일 vs 이전 7일)
    const last7 = dailySeries.slice(-7);
    const prev7 = dailySeries.slice(-14, -7);
    const avgOf = arr => arr.length ? arr.reduce((a, p) => a + p.value, 0) / arr.length : null;
    const last7Avg = avgOf(last7);
    const prev7Avg = avgOf(prev7);
    const trendPct = (prev7Avg && prev7Avg > 0) ? ((last7Avg - prev7Avg) / prev7Avg) * 100 : null;

    const insights = [];
    if (trendPct !== null) {
      const up = trendPct >= 0;
      insights.push(`최근 7일 평균 방문자는 ${fmt(last7Avg)}명으로, 이전 7일(${fmt(prev7Avg)}명) 대비 <span style="color:${up ? "var(--good)" : "var(--bad)"}; font-weight:600;">${up ? "▲" : "▼"} ${Math.abs(trendPct).toFixed(1)}%</span> ${up ? "증가" : "감소"} 추세예요`);
    }
    if (curRank !== null) {
      if (rankChange === null) {
        insights.push(`밀리플레이스 전체 ${totalStores}개 매장 중 <b>${curRank}위</b>예요`);
      } else if (rankChange > 0) {
        insights.push(`이번 달 <b>${curRank}위</b>로, 전월(${prevRank}위) 대비 <span style="color:var(--good); font-weight:600;">▲${rankChange}계단 상승</span>했어요`);
      } else if (rankChange < 0) {
        insights.push(`이번 달 <b>${curRank}위</b>로, 전월(${prevRank}위) 대비 <span style="color:var(--bad); font-weight:600;">▼${Math.abs(rankChange)}계단 하락</span>했어요`);
      } else {
        insights.push(`이번 달도 <b>${curRank}위</b>로 순위 변동이 없어요`);
      }
    }
    if (hasWeekdayData) {
      insights.push(`<b>${weekdayNames[bestWd]}요일</b>에 방문자가 가장 많아요 (평균 ${fmt(wdAvgs[bestWd])}명) · <b>${weekdayNames[worstWd]}요일</b>이 가장 적어요 (평균 ${fmt(wdAvgs[worstWd])}명)`);
    }

    function rankChangeBadge() {
      if (rankChange === null) return "";
      if (rankChange > 0) return `<span class="kpi-delta up">▲ ${rankChange}계단</span>`;
      if (rankChange < 0) return `<span class="kpi-delta down">▼ ${Math.abs(rankChange)}계단</span>`;
      return `<span class="kpi-delta" style="color:var(--ink-faint); background:#f1f2f5;">- 변동없음</span>`;
    }

    const insightsHtml = insights.length
      ? `<div class="section-card">
          <div class="section-head"><h2>📌 ${storeName} 매장 인사이트</h2></div>
          <ul style="margin:0; padding-left:18px; font-size:13.5px; line-height:1.9;">
            ${insights.map(t => `<li>${t}</li>`).join("")}
          </ul>
        </div>`
      : "";

    detailArea.innerHTML = `
      ${insightsHtml}
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-label">${curLabel} 누적 방문자</div></div>
          <div class="kpi-value-row">
            <div class="kpi-value">${fmt(curVal)}<span class="unit">건</span></div>
            ${deltaBadge(monthDelta)}
          </div>
          <div class="kpi-sub">전월(${prevLabel || "-"}) 대비</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-label">이번 달 순위</div></div>
          <div class="kpi-value-row">
            <div class="kpi-value">${curRank ? curRank : "-"}<span class="unit">/ ${totalStores}개 매장 중</span></div>
            ${rankChangeBadge()}
          </div>
          <div class="kpi-sub">전월 순위: ${prevRank ? prevRank + "위" : "-"}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-label">누적 방문자 (전체 기간)</div></div>
          <div class="kpi-value-row"><div class="kpi-value">${fmt(totalAllTime)}<span class="unit">건</span></div></div>
          <div class="kpi-sub">${dailySeries.length ? dailySeries[0].date + " ~" : "-"}</div>
        </div>
      </div>

      <div class="section-card">
        <div class="section-head">
          <h2>일별 방문자 추이 (최근 60일)</h2>
          <span style="font-size:11px; color:var(--ink-faint);">혜택클릭 페이지 순 방문자 기준 · 60일 평균 ${dailyAvg !== null ? fmt(dailyAvg) : "-"}명</span>
        </div>
        <div class="trend-chart-wrap tall"><canvas id="partnerDailyChart"></canvas></div>
      </div>

      <div class="two-col">
        <div class="section-card">
          <div class="section-head">
            <h2>월별 누적 추이</h2>
            <span style="font-size:11px; color:var(--ink-faint);">혜택사용 회원수 기준</span>
          </div>
          <div class="bar-chart-wrap"><canvas id="partnerMonthlyChart"></canvas></div>
        </div>
        <div class="section-card">
          <div class="section-head">
            <h2>매장 순위 추이</h2>
            <span style="font-size:11px; color:var(--ink-faint);">월별 혜택사용 회원수 기준</span>
          </div>
          <div class="bar-chart-wrap"><canvas id="partnerRankChart"></canvas></div>
        </div>
      </div>`;

    partnerCharts.daily = new Chart(document.getElementById("partnerDailyChart"), {
      type: "line",
      data: {
        labels: recentDaily.map(p => p.date.slice(5)),
        datasets: [
          {
            data: recentDaily.map(p => p.value),
            borderColor: "#6366f1",
            backgroundColor: "#6366f1",
            tension: 0.3,
            pointRadius: 2,
            borderWidth: 2,
          },
          {
            data: recentDaily.map(() => dailyAvg),
            borderColor: "#9ca3af",
            borderDash: [5, 4],
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0,
            fill: false,
          },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          datalabels: {
            align: "top",
            offset: 3,
            font: { size: 8.5, family: "'IBM Plex Mono', monospace", weight: 600 },
            color: "#6366f1",
            backgroundColor: "rgba(255,255,255,0.85)",
            borderRadius: 3,
            padding: { top: 1, bottom: 1, left: 2, right: 2 },
            formatter: (v, ctx) => {
              if (ctx.datasetIndex !== 0 || v === null) return "";
              return Math.round(v).toLocaleString("ko-KR");
            },
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#9ca3af", font: { size: 11 }, maxTicksLimit: 12 } },
          y: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },
        },
      },
    });

    partnerCharts.monthly = new Chart(document.getElementById("partnerMonthlyChart"), {
      type: "bar",
      data: {
        labels: monthlySeries.map(p => p.month),
        datasets: [{ data: monthlySeries.map(p => p.value), backgroundColor: "#6366f1", borderRadius: 4, maxBarThickness: 28 }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          datalabels: {
            anchor: "end", align: "top",
            font: { size: 10, family: "'IBM Plex Mono', monospace", weight: 600 },
            color: "#374151",
            formatter: v => v ? v.toLocaleString("ko-KR") : "",
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#9ca3af", font: { size: 10 } } },
          y: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },
        },
      },
    });

    partnerCharts.rank = new Chart(document.getElementById("partnerRankChart"), {
      type: "line",
      data: {
        labels: rankSeries.map(p => p.month),
        datasets: [{
          data: rankSeries.map(p => p.rank),
          borderColor: "#7c3aed",
          backgroundColor: "#7c3aed",
          tension: 0.3,
          pointRadius: 3,
          borderWidth: 2,
          spanGaps: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          datalabels: {
            align: "top",
            font: { size: 10, family: "'IBM Plex Mono', monospace", weight: 600 },
            color: "#7c3aed",
            formatter: v => v ? `${v}위` : "",
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#9ca3af", font: { size: 10 } } },
          y: { reverse: true, grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 }, precision: 0 } },
        },
      },
    });
  }

  function renderPartnerTab() {
    const area = document.getElementById("partner-area");
    const storeMetric = METRICS_DATA[STORE_KEY];
    const hasStoreData = storeMetric && storeMetric.data && storeMetric.data.length;

    if (!hasStoreData) {
      area.innerHTML = `<div class="placeholder-panel"><div class="icon">🏬</div><h3>제휴처 데이터 없음</h3><p>매장별 데이터가 아직 없습니다.</p></div>`;
      return;
    }

    const { label_key, data, monthly_totals } = storeMetric;
    const dsMetric = METRICS_DATA["daily_store"];
    const dailyTotalsForNames = (dsMetric && dsMetric.daily_totals) || {};
    const augmentedMonthlyTotals = getAugmentedMonthlyTotals(monthly_totals || {}, dailyTotalsForNames);
    const hasHistory = Object.keys(augmentedMonthlyTotals).length > 0;
    const namesSorted = hasHistory
      ? Object.entries(
          getSortedMonths(augmentedMonthlyTotals).reduce((acc, m) => {
            Object.entries(augmentedMonthlyTotals[m]).forEach(([n, v]) => { acc[n] = (acc[n] || 0) + v; });
            return acc;
          }, {})
        ).sort((a, b) => b[1] - a[1]).map(([n]) => n)
      : Array.from(new Set(data.map(r => r[label_key])));

    area.innerHTML = `
      <div class="section-card">
        <div class="section-head"><h2>제휴처 검색</h2></div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <input type="text" id="partner-search" class="store-select"
                 style="flex:1; min-width:180px; max-width:240px; padding:9px 14px;"
                 placeholder="매장명 검색">
          <select id="partner-select" class="store-select" style="flex:2; min-width:220px; max-width:360px; padding:9px 14px;">
            ${namesSorted.map(n => `<option value="${n}">${n}</option>`).join("")}
          </select>
        </div>
      </div>
      <div id="partner-detail-area"></div>`;

    const searchInput = document.getElementById("partner-search");
    const selectEl = document.getElementById("partner-select");

    function populateSelect(names) {
      const prevVal = selectEl.value;
      selectEl.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join("");
      if (names.includes(prevVal)) selectEl.value = prevVal;
    }

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim();
      const filtered = q ? namesSorted.filter(n => n.includes(q)) : namesSorted;
      populateSelect(filtered);
      if (filtered.length) renderPartnerDetail(selectEl.value);
    });

    selectEl.addEventListener("change", () => renderPartnerDetail(selectEl.value));

    if (namesSorted.length) renderPartnerDetail(namesSorted[0]);
  }

  function renderEventTab() {
    const area = document.getElementById("event-area");
    area.innerHTML = `
      <div class="placeholder-panel">
        <div class="icon">🎯</div>
        <h3>이벤트 Tracking 준비 중</h3>
        <p>프로모션·이벤트별 참여 데이터를 연동하면 이 탭에서 확인할 수 있어요.<br>조만간 업데이트될 예정입니다.</p>
      </div>`;
  }

  /* ================= 공통 ================= */

  function setupTabs() {
    document.querySelectorAll("#tab-nav button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#tab-nav button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
      });
    });
  }

  async function load() {
    try {
      const res = await fetch("./data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("data.json을 불러오지 못했습니다");
      const data = await res.json();
      METRICS_DATA = data.metrics || {};

      setupTabs();
      renderKpiTab();
      renderDailyTab();
      renderWeeklyTab();
      renderMonthlyTab();
      renderPartnerTab();
      renderEventTab();

      document.getElementById("updated-at").textContent = data.updated_at || "-";
    } catch (e) {
      const errHtml = `<div class="error">데이터를 불러오지 못했습니다.<br>${e.message}</div>`;
      document.getElementById("kpi-area").innerHTML = errHtml;
      document.getElementById("daily-area").innerHTML = errHtml;
      document.getElementById("updated-at").textContent = "오류";
    }
  }

  load();
</script>
</body>
</html>
