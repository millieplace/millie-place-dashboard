<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>밀리플레이스 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root {
    --bg: #eef0f3;
    --card: #ffffff;
    --border: #e3e6eb;
    --ink: #12151b;
    --ink-soft: #667085;
    --ink-faint: #9aa2b1;
    --accent: #a8562a;
    --accent-soft: #f6e9dc;
    --uv-color: #2563eb;
    --benefit-color: #10b981;
    --staff-color: #f59e0b;
    --good: #15803d;
    --bad: #dc2626;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
  }
  .topbar .title-block .eyebrow {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.03em;
    margin-bottom: 5px;
  }
  .topbar h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
  }
  .status-pill .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 0 3px rgba(21,128,61,0.15);
  }

  /* ---------- Tabs ---------- */
  .tab-nav {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-nav button {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-faint);
    padding: 10px 4px;
    margin-right: 22px;
    cursor: pointer;
    position: relative;
    top: 1px;
  }
  .tab-nav button.active {
    color: var(--ink);
    border-bottom: 2px solid var(--accent);
  }
  .tab-nav button:hover:not(.active) { color: var(--ink-soft); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .placeholder-panel {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 60px 20px;
    text-align: center;
  }
  .placeholder-panel .icon { font-size: 28px; margin-bottom: 10px; }
  .placeholder-panel h3 { font-size: 15px; margin: 0 0 6px; }
  .placeholder-panel p { font-size: 13px; color: var(--ink-soft); margin: 0; }

  /* ---------- KPI cards ---------- */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 14px;
  }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 16px 18px 12px;
  }
  .kpi-card .kpi-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .kpi-card .kpi-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kpi-card .kpi-dot {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .kpi-card .kpi-value-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .kpi-card .kpi-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .kpi-card .kpi-value .unit {
    font-size: 12.5px;
    color: var(--ink-faint);
    font-weight: 500;
    margin-left: 3px;
  }
  .kpi-card .kpi-delta {
    font-size: 11.5px;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    padding: 1px 6px;
    border-radius: 5px;
  }
  .kpi-delta.up { color: var(--good); background: rgba(21,128,61,0.08); }
  .kpi-delta.down { color: var(--bad); background: rgba(220,38,38,0.08); }
  .kpi-card .kpi-spark {
    height: 36px;
    margin-top: 6px;
  }
  .kpi-card .kpi-sub {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  /* ---------- Section cards ---------- */
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 18px 20px 20px;
    margin-bottom: 14px;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .section-head h2 {
    font-size: 14.5px;
    font-weight: 700;
    margin: 0;
  }
  .section-head .legend {
    display: flex;
    gap: 13px;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Segmented control */
  .segmented {
    display: inline-flex;
    background: #f1f2f5;
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }
  .segmented button {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .segmented button.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(16,24,40,0.08);
  }
  .segmented button:hover:not(.active) { color: var(--ink); }

  select.store-select {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    background: #f1f2f5;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
  }

  .trend-chart-wrap { height: 270px; }
  .trend-chart-wrap.tall { height: 320px; }

  .two-col {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 14px;
  }

  .bar-chart-wrap { height: 300px; }
  .bar-chart-wrap.tall { height: 420px; }

  .store-stats-row {
    display: flex;
    gap: 20px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .store-stat { }
  .store-stat .label { font-size: 11px; color: var(--ink-faint); margin-bottom: 2px; }
  .store-stat .value { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600; }

  table.rank-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.rank-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.rank-table td {
    padding: 8px 8px;
    border-bottom: 1px solid #f0f1f3;
  }
  table.rank-table tr:last-child td { border-bottom: none; }
  table.rank-table td.rank-num {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-faint);
    width: 26px;
  }
  table.rank-table td.rank-val {
    font-family: 'IBM Plex Mono', monospace;
    text-align: right;
    font-weight: 600;
  }

  .empty-note {
    font-size: 12.5px;
    color: var(--ink-faint);
    padding: 20px 0;
    text-align: center;
  }

  .footer {
    text-align: center;
    margin-top: 22px;
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  .loading, .error {
    text-align: center;
    padding: 60px 0;
    font-size: 13px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
  }
  .error { color: var(--bad); }

  @media (max-width: 760px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title-block">
        <div class="eyebrow">MILLIE'S LIBRARY × CAFE PARTNERSHIP</div>
        <h1>밀리플레이스 대시보드</h1>
      </div>
      <div class="status-pill"><span class="dot"></span><span id="updated-at">불러오는 중...</span></div>
    </div>

    <div class="tab-nav" id="tab-nav">
      <button class="active" data-tab="daily">일별 트래킹</button>
      <button data-tab="monthly">월간 데이터</button>
      <button data-tab="partner">제휴처별 데이터</button>
    </div>

    <div class="tab-panel active" id="tab-daily">
      <div id="daily-area"><div class="loading">데이터 불러오는 중...</div></div>
    </div>

    <div class="tab-panel" id="tab-monthly">
      <div id="monthly-area"></div>
    </div>

    <div class="tab-panel" id="tab-partner">
      <div id="partner-area"></div>
    </div>

    <div class="footer">밀리의서재 · Millie Place</div>
  </div>

<script>
  Chart.register(ChartDataLabels);

  const COLORS = { uv: "#2563eb", benefit_claims: "#10b981", staff_verifications: "#f59e0b" };
  const LABEL_POS = {
    uv: { align: "top", anchor: "end" },
    benefit_claims: { align: "top", anchor: "end" },
    staff_verifications: { align: "bottom", anchor: "start" },
  };
  const METRIC_ORDER = ["uv", "benefit_claims", "staff_verifications"];
  const STORE_KEY = "store_breakdown";

  let METRICS_DATA = {};
  let monthlyPeriod = "month";
  let dailyChartInstance = null;
  let monthlyChartInstance = null;
  let storeChartInstance = null;

  function fmt(n) {
    if (n === null || n === undefined) return "-";
    return Math.round(n).toLocaleString("ko-KR");
  }

  function sparklineSvg(values, color) {
    if (!values || values.length < 2) return "";
    const w = 240, h = 36, pad = 3;
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max - min) || 1;
    const step = (w - pad * 2) / (values.length - 1);
    const pts = values.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  function weeklyDelta(series) {
    if (!series || series.length < 14) return null;
    const last7 = series.slice(-7).reduce((a, p) => a + p.value, 0);
    const prev7 = series.slice(-14, -7).reduce((a, p) => a + p.value, 0);
    if (prev7 === 0) return null;
    return ((last7 - prev7) / prev7) * 100;
  }

  function deltaBadge(delta) {
    if (delta === null || delta === undefined || !isFinite(delta)) return "";
    const cls = delta >= 0 ? "up" : "down";
    const arrow = delta >= 0 ? "▲" : "▼";
    return `<span class="kpi-delta ${cls}">${arrow} ${Math.abs(delta).toFixed(1)}%</span>`;
  }

  function getQuarter(dateStr) {
    const month = parseInt(dateStr.slice(5, 7), 10);
    return Math.ceil(month / 3);
  }

  function aggregateSeries(series, period) {
    if (!series || series.length === 0) return [];
    if (period === "day") {
      return series.slice(-30).map(p => ({ key: p.date, label: p.date.slice(5), value: p.value }));
    }
    const buckets = {};
    series.forEach(p => {
      let key;
      if (period === "month") key = p.date.slice(0, 7);
      else key = `${p.date.slice(0, 4)}-Q${getQuarter(p.date)}`;
      buckets[key] = (buckets[key] || 0) + p.value;
    });
    return Object.keys(buckets).sort().map(key => ({
      key,
      label: period === "month" ? key : key.replace("-", " "),
      value: buckets[key],
    }));
  }

  /* ================= 일별 트래킹 탭 ================= */

  function sumRangeInclusive(series, startDate, endDate) {
    return series.filter(p => p.date >= startDate && p.date <= endDate)
                 .reduce((a, p) => a + p.value, 0);
  }

  function computeMonthToDateKpi(series) {
    if (!series || series.length === 0) return { current: null, delta: null, monthLabel: "" };
    const latest = series[series.length - 1].date;
    const [y, m, d] = latest.split("-").map(Number);

    const startCur = `${y}-${String(m).padStart(2, "0")}-01`;
    const current = sumRangeInclusive(series, startCur, latest);

    let prevYear = y, prevMonth = m - 1;
    if (prevMonth === 0) { prevMonth = 12; prevYear -= 1; }
    const daysInPrevMonth = new Date(prevYear, prevMonth, 0).getDate();
    const prevDay = Math.min(d, daysInPrevMonth);
    const startPrev = `${prevYear}-${String(prevMonth).padStart(2, "0")}-01`;
    const endPrev = `${prevYear}-${String(prevMonth).padStart(2, "0")}-${String(prevDay).padStart(2, "0")}`;
    const prev = sumRangeInclusive(series, startPrev, endPrev);

    let delta = null;
    if (prev > 0) delta = ((current - prev) / prev) * 100;
    return { current, delta, monthLabel: `${m}월`, startCur };
  }

  function renderDailyKpiCards() {
    let html = "";
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (!m) return;
      const color = COLORS[key];
      const { current, delta, monthLabel, startCur } = computeMonthToDateKpi(m.series);
      const sparkSeries = (m.series || []).filter(p => !startCur || p.date >= startCur).map(p => p.value);
      html += `
        <div class="kpi-card">
          <div class="kpi-top">
            <div class="kpi-label"><span class="kpi-dot" style="background:${color}"></span>${m.label}</div>
          </div>
          <div class="kpi-value-row">
            <div class="kpi-value">${fmt(current)}<span class="unit">건</span></div>
            ${deltaBadge(delta)}
          </div>
          <div class="kpi-spark">${sparklineSvg(sparkSeries, color)}</div>
          <div class="kpi-sub">${monthLabel} 누적 · 전월 동기간比</div>
        </div>`;
    });
    return html;
  }

  function renderDailyTrendChart() {
    const ctx = document.getElementById("dailyTrendChart");
    if (!ctx) return;
    if (dailyChartInstance) { dailyChartInstance.destroy(); dailyChartInstance = null; }

    const perMetric = {};
    let allKeys = new Set();
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (m && m.series && m.series.length) {
        const agg = aggregateSeries(m.series, "day");
        perMetric[key] = agg;
        agg.forEach(p => allKeys.add(p.key));
      }
    });
    const sortedKeys = Array.from(allKeys).sort();
    if (sortedKeys.length === 0) return;
    const labelMap = {};
    METRIC_ORDER.forEach(key => (perMetric[key] || []).forEach(p => { labelMap[p.key] = p.label; }));
    const labels = sortedKeys.map(k => labelMap[k] || k);

    const datasets = METRIC_ORDER.filter(k => perMetric[k]).map(key => {
      const valueByKey = {};
      perMetric[key].forEach(p => { valueByKey[p.key] = p.value; });
      const pos = LABEL_POS[key] || { align: "top", anchor: "end" };
      return {
        label: METRICS_DATA[key].label,
        data: sortedKeys.map(k => valueByKey[k] !== undefined ? valueByKey[k] : null),
        borderColor: COLORS[key],
        backgroundColor: COLORS[key],
        tension: 0.3,
        pointRadius: (ctx) => {
          const i = ctx.dataIndex, len = ctx.dataset.data.length;
          return (i % 2 === 0 || i === len - 1) ? 3 : 0;
        },
        pointBackgroundColor: COLORS[key],
        borderWidth: 2,
        spanGaps: true,
        datalabels: {
          align: pos.align,
          anchor: pos.anchor,
          offset: 5,
        },
      };
    });

    dailyChartInstance = new Chart(ctx, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          datalabels: {
            font: { size: 10, family: "'IBM Plex Mono', monospace", weight: 600 },
            color: (c) => c.dataset.borderColor,
            backgroundColor: "rgba(255,255,255,0.85)",
            borderRadius: 3,
            padding: { top: 1, bottom: 1, left: 3, right: 3 },
            formatter: (v, ctx) => {
              if (v === null) return "";
              const i = ctx.dataIndex, len = ctx.dataset.data.length;
              if (i % 2 === 0 || i === len - 1) return Math.round(v).toLocaleString("ko-KR");
              return "";
            },
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#9ca3af", font: { size: 11 } } },
          y: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },
        },
      },
    });
  }

  /* ================= 일별 제휴처 방문자 (급증/급감) ================= */

  function renderDailyStoreSection() {
    const dsMetric = METRICS_DATA["daily_store"];
    const area = document.getElementById("daily-store-area");
    const dailyTotals = dsMetric && dsMetric.daily_totals;

    if (!dailyTotals || Object.keys(dailyTotals).length === 0) {
      area.innerHTML = `
        <div class="placeholder-panel" style="padding:36px 20px;">
          <div class="icon">📅</div>
          <h3>일별 매장 데이터 연동 대기 중</h3>
          <p>지금 연동된 매장별 데이터는 월 단위라, 날짜별 매장 방문자 순위·급증/급감을 보여주려면<br>
          Superset에 <b>매장별 × 일별</b> 지표 차트가 하나 더 필요해요.</p>
        </div>`;
      return;
    }

    const dates = getSortedDates(dailyTotals);
    if (!dailyStoreDate || !dates.includes(dailyStoreDate)) {
      dailyStoreDate = dates[dates.length - 1];
    }
    const idx = dates.indexOf(dailyStoreDate);
    const dayData = dailyTotals[dailyStoreDate] || {};
    const top10 = Object.entries(dayData).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const { surges, drops, prevDate } = computeDailyStoreDelta(dailyTotals, dates, dailyStoreDate);

    area.innerHTML = `
      <div class="section-head">
        <h2>일별 제휴처 방문자 (혜택클릭 기준)</h2>
        <div class="segmented" id="daily-store-nav">
          <button id="ds-prev" ${idx <= 0 ? "disabled" : ""}>◀</button>
          <button disabled style="color:var(--ink); background:var(--card);">${dailyStoreDate}</button>
          <button id="ds-next" ${idx >= dates.length - 1 ? "disabled" : ""}>▶</button>
        </div>
      </div>
      <div class="two-col">
        <div>
          <div class="section-head"><h2 style="font-size:12.5px; color:var(--ink-soft);">TOP 10</h2></div>
          <table class="rank-table">
            <thead><tr><th>순위</th><th>매장</th><th style="text-align:right">방문자</th></tr></thead>
            <tbody>
              ${top10.map(([name, v], i) => `
                <tr>
                  <td class="rank-num">${String(i + 1).padStart(2, "0")}</td>
                  <td>${name}</td>
                  <td class="rank-val">${fmt(v)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div>
          <div class="section-head"><h2 style="font-size:12.5px; color:var(--ink-soft);">전일 대비 급증/급감${prevDate ? ` (vs ${prevDate})` : ""}</h2></div>
          ${!prevDate ? '<div class="empty-note">비교할 전일 데이터가 없습니다.</div>' : `
          <table class="rank-table" style="margin-bottom:10px;">
            <tbody>
              ${surges.length ? surges.map(([name, cur, prev, delta]) => `
                <tr>
                  <td>▲ ${name}</td>
                  <td class="rank-val" style="color:var(--good)">+${fmt(delta)}</td>
                  <td class="rank-val" style="color:var(--ink-faint); font-size:11px;">${fmt(prev)}→${fmt(cur)}</td>
                </tr>`).join("") : '<tr><td class="empty-note">급증 매장 없음</td></tr>'}
              ${drops.length ? drops.map(([name, cur, prev, delta]) => `
                <tr>
                  <td>▼ ${name}</td>
                  <td class="rank-val" style="color:var(--bad)">${fmt(delta)}</td>
                  <td class="rank-val" style="color:var(--ink-faint); font-size:11px;">${fmt(prev)}→${fmt(cur)}</td>
                </tr>`).join("") : ""}
            </tbody>
          </table>`}
        </div>
      </div>`;

    const prevBtn = document.getElementById("ds-prev");
    const nextBtn = document.getElementById("ds-next");
    if (prevBtn) prevBtn.addEventListener("click", () => {
      if (idx > 0) { dailyStoreDate = dates[idx - 1]; renderDailyStoreSection(); }
    });
    if (nextBtn) nextBtn.addEventListener("click", () => {
      if (idx < dates.length - 1) { dailyStoreDate = dates[idx + 1]; renderDailyStoreSection(); }
    });
  }

  function getMonthKeyFromDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  }

  function aggregateDailyStoreForMonth(dailyTotals, monthKey) {
    const totals = {};
    Object.keys(dailyTotals || {}).forEach(date => {
      if (date.startsWith(monthKey)) {
        Object.entries(dailyTotals[date]).forEach(([name, v]) => {
          totals[name] = (totals[name] || 0) + v;
        });
      }
    });
    return totals;
  }

  function computeMonthlyStoreChange(monthlyTotals, dailyTotals) {
    const months = getSortedMonths(monthlyTotals);
    const today = new Date();
    const curMonthKey = getMonthKeyFromDate(today);
    let cur, prev, curLabel, prevLabel, usingFallback = false;

    if (months.includes(curMonthKey)) {
      const idx = months.indexOf(curMonthKey);
      curLabel = curMonthKey;
      cur = monthlyTotals[curMonthKey];
      prevLabel = idx > 0 ? months[idx - 1] : null;
      prev = prevLabel ? monthlyTotals[prevLabel] : {};
    } else if (dailyTotals && Object.keys(dailyTotals).some(d => d.startsWith(curMonthKey))) {
      curLabel = curMonthKey;
      cur = aggregateDailyStoreForMonth(dailyTotals, curMonthKey);
      prevLabel = months.length ? months[months.length - 1] : null;
      prev = prevLabel ? monthlyTotals[prevLabel] : {};
      usingFallback = true;
    } else if (months.length >= 2) {
      prevLabel = months[months.length - 2];
      curLabel = months[months.length - 1];
      prev = monthlyTotals[prevLabel];
      cur = monthlyTotals[curLabel];
    } else {
      return { curLabel: null, prevLabel: null, increases: [], decreases: [], usingFallback: false };
    }

    const allNames = new Set([...Object.keys(cur || {}), ...Object.keys(prev || {})]);
    const deltas = [];
    allNames.forEach(name => {
      const c = (cur || {})[name] || 0;
      const p = (prev || {})[name] || 0;
      deltas.push([name, c, p, c - p]);
    });
    const sorted = [...deltas].sort((a, b) => b[3] - a[3]);
    const increases = sorted.filter(d => d[3] > 0).slice(0, 10);
    const decreases = sorted.filter(d => d[3] < 0).slice(-10).reverse();
    return { curLabel, prevLabel, increases, decreases, usingFallback };
  }

  function renderMonthlyStoreChangeSection() {
    const storeMetric = METRICS_DATA[STORE_KEY];
    const dsMetric = METRICS_DATA["daily_store"];
    const area = document.getElementById("monthly-store-change-area");
    const monthlyTotals = (storeMetric && storeMetric.monthly_totals) || {};
    const dailyTotals = dsMetric && dsMetric.daily_totals;

    const { curLabel, prevLabel, increases, decreases, usingFallback } = computeMonthlyStoreChange(monthlyTotals, dailyTotals);

    if (!curLabel) {
      area.innerHTML = `
        <div class="section-head"><h2>월별 제휴처 방문자 증감 (TOP 10)</h2></div>
        <div class="empty-note">비교할 수 있는 두 달치 데이터가 아직 없습니다. 매일 누적되니 조금만 기다려주세요.</div>`;
      return;
    }

    function rows(list, sign) {
      if (!list.length) return `<tr><td class="empty-note">해당 매장 없음</td></tr>`;
      return list.map(([name, c, p, delta], i) => `
        <tr>
          <td class="rank-num">${String(i + 1).padStart(2, "0")}</td>
          <td>${name}</td>
          <td class="rank-val" style="color:${sign > 0 ? "var(--good)" : "var(--bad)"}">${sign > 0 ? "+" : ""}${fmt(delta)}</td>
          <td class="rank-val" style="color:var(--ink-faint); font-size:11px;">${fmt(p)}→${fmt(c)}</td>
        </tr>`).join("");
    }

    area.innerHTML = `
      <div class="section-head">
        <h2>월별 제휴처 방문자 증감 (TOP 10, ${prevLabel || "-"} → ${curLabel})</h2>
      </div>
      ${usingFallback ? `<div class="empty-note" style="text-align:left; padding:0 0 10px;">※ 이번 달(${curLabel})은 아직 월별 집계 전이라, 일별 매장 데이터(혜택클릭 기준)로 집계한 값이에요.</div>` : ""}
      <div class="two-col">
        <div>
          <div class="section-head"><h2 style="font-size:12.5px; color:var(--ink-soft);">▲ 증가 TOP 10</h2></div>
          <table class="rank-table"><tbody>${rows(increases, 1)}</tbody></table>
        </div>
        <div>
          <div class="section-head"><h2 style="font-size:12.5px; color:var(--ink-soft);">▼ 감소 TOP 10</h2></div>
          <table class="rank-table"><tbody>${rows(decreases, -1)}</tbody></table>
        </div>
      </div>`;
  }

  function renderDailyTab() {
    const area = document.getElementById("daily-area");
    area.innerHTML = `
      <div class="kpi-grid">${renderDailyKpiCards()}</div>
      <div class="section-card">
        <div class="section-head">
          <h2>일별 추이 (최근 30일)</h2>
          <div class="legend">
            ${METRIC_ORDER.filter(k => METRICS_DATA[k]).map(k => `
              <span class="legend-item"><span class="legend-dot" style="background:${COLORS[k]}"></span>${METRICS_DATA[k].label}</span>
            `).join("")}
          </div>
        </div>
        <div class="trend-chart-wrap tall"><canvas id="dailyTrendChart"></canvas></div>
      </div>
      <div class="section-card" id="daily-store-area"></div>`;
    renderDailyTrendChart();
    renderDailyStoreSection();
  }

  /* ================= 월간 데이터 탭 ================= */

  function monthOverMonthDelta(agg) {
    if (agg.length < 2) return null;
    const cur = agg[agg.length - 1].value;
    const prev = agg[agg.length - 2].value;
    if (prev === 0) return null;
    return ((cur - prev) / prev) * 100;
  }

  function renderMonthlyKpiCards() {
    let html = "";
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (!m || !m.series || !m.series.length) return;
      const color = COLORS[key];
      const agg = aggregateSeries(m.series, "month");
      const latest = agg[agg.length - 1];
      const delta = monthOverMonthDelta(agg);
      html += `
        <div class="kpi-card">
          <div class="kpi-top">
            <div class="kpi-label"><span class="kpi-dot" style="background:${color}"></span>${m.label}</div>
          </div>
          <div class="kpi-value-row">
            <div class="kpi-value">${fmt(latest ? latest.value : null)}<span class="unit">건</span></div>
            ${deltaBadge(delta)}
          </div>
          <div class="kpi-spark">${sparklineSvg(agg.map(p => p.value), color)}</div>
          <div class="kpi-sub">${latest ? latest.label : "-"} 합계 · 전월比</div>
        </div>`;
    });
    return html;
  }

  function renderMonthlyTrendChart() {
    const ctx = document.getElementById("monthlyTrendChart");
    if (!ctx) return;
    if (monthlyChartInstance) { monthlyChartInstance.destroy(); monthlyChartInstance = null; }

    const perMetric = {};
    let allKeys = new Set();
    METRIC_ORDER.forEach(key => {
      const m = METRICS_DATA[key];
      if (m && m.series && m.series.length) {
        const agg = aggregateSeries(m.series, monthlyPeriod);
        perMetric[key] = agg;
        agg.forEach(p => allKeys.add(p.key));
      }
    });
    const sortedKeys = Array.from(allKeys).sort();
    if (sortedKeys.length === 0) return;
    const labelMap = {};
    METRIC_ORDER.forEach(key => (perMetric[key] || []).forEach(p => { labelMap[p.key] = p.label; }));
    const labels = sortedKeys.map(k => labelMap[k] || k);

    const datasets = METRIC_ORDER.filter(k => perMetric[k]).map(key => {
      const valueByKey = {};
      perMetric[key].forEach(p => { valueByKey[p.key] = p.value; });
      const pos = LABEL_POS[key] || { align: "top", anchor: "end" };
      return {
        label: METRICS_DATA[key].label,
        data: sortedKeys.map(k => valueByKey[k] !== undefined ? valueByKey[k] : null),
        borderColor: COLORS[key],
        backgroundColor: COLORS[key],
        tension: 0.3,
        pointRadius: 4,
        pointBackgroundColor: COLORS[key],
        borderWidth: 2,
        spanGaps: true,
        datalabels: { align: pos.align, anchor: pos.anchor, offset: 5 },
      };
    });

    monthlyChartInstance = new Chart(ctx, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          datalabels: {
            font: { size: 10.5, family: "'IBM Plex Mono', monospace", weight: 600 },
            color: (c) => c.dataset.borderColor,
            backgroundColor: "rgba(255,255,255,0.85)",
            borderRadius: 3,
            padding: { top: 1, bottom: 1, left: 3, right: 3 },
            formatter: (v) => v === null ? "" : Math.round(v).toLocaleString("ko-KR"),
          },
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#9ca3af", font: { size: 11 } } },
          y: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },
        },
      },
    });
  }

  function renderMonthlyTab() {
    const area = document.getElementById("monthly-area");
    area.innerHTML = `
      <div class="kpi-grid">${renderMonthlyKpiCards()}</div>
      <div class="section-card">
        <div class="section-head">
          <h2>기간별 추이</h2>
          <div style="display:flex; align-items:center; gap:16px;">
            <div class="legend">
              ${METRIC_ORDER.filter(k => METRICS_DATA[k]).map(k => `
                <span class="legend-item"><span class="legend-dot" style="background:${COLORS[k]}"></span>${METRICS_DATA[k].label}</span>
              `).join("")}
            </div>
            <div class="segmented" id="monthly-period-toggle">
              <button class="active" data-period="month">월별</button>
              <button data-period="quarter">분기별</button>
            </div>
          </div>
        </div>
        <div class="trend-chart-wrap tall"><canvas id="monthlyTrendChart"></canvas></div>
      </div>
      <div class="section-card" id="monthly-store-change-area"></div>`;
    renderMonthlyTrendChart();
    renderMonthlyStoreChangeSection();
    document.querySelectorAll("#monthly-period-toggle button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#monthly-period-toggle button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        monthlyPeriod = btn.dataset.period;
        renderMonthlyTrendChart();
      });
    });
  }

  /* ================= 제휴처별 데이터 탭 ================= */

  let storePeriod = "all";
  let dailyStoreDate = null;

  function getSortedDates(dailyTotals) {
    return Object.keys(dailyTotals || {}).sort();
  }

  function computeDailyStoreDelta(dailyTotals, dates, currentDate) {
    const idx = dates.indexOf(currentDate);
    if (idx <= 0) return { surges: [], drops: [] };
    const prevDate = dates[idx - 1];
    const cur = dailyTotals[currentDate] || {};
    const prev = dailyTotals[prevDate] || {};
    const deltas = [];
    Object.keys(cur).forEach(name => {
      if (prev[name] !== undefined) {
        deltas.push([name, cur[name], prev[name], cur[name] - prev[name]]);
      }
    });
    const sorted = [...deltas].sort((a, b) => b[3] - a[3]);
    const surges = sorted.filter(d => d[3] > 0).slice(0, 5);
    const drops = sorted.filter(d => d[3] < 0).slice(-5).reverse();
    return { surges, drops, prevDate };
  }

  function computeStoreTotals(rows, metricKey, labelKey) {
    const totals = {};
    rows.forEach(r => {
      const name = r[labelKey];
      totals[name] = (totals[name] || 0) + (Number(r[metricKey]) || 0);
    });
    return Object.entries(totals).sort((a, b) => b[1] - a[1]);
  }

  function getSortedMonths(monthlyTotals) {
    return Object.keys(monthlyTotals || {}).sort();
  }

  function filterMonthsByPeriod(months, period) {
    if (period === "all") return months;
    const n = period === "1m" ? 1 : period === "3m" ? 3 : 6;
    return months.slice(-n);
  }

  function aggregateStoreTotalsFromHistory(monthlyTotals, months) {
    const totals = {};
    months.forEach(m => {
      const bucket = monthlyTotals[m] || {};
      Object.entries(bucket).forEach(([name, val]) => {
        totals[name] = (totals[name] || 0) + val;
      });
    });
    return Object.entries(totals).sort((a, b) => b[1] - a[1]);
  }

  function storeMonthlySeriesFromHistory(monthlyTotals, months, storeName) {
    return months.map(m => ({ label: m, value: (monthlyTotals[m] || {})[storeName] || 0 }));
  }

  function computeStoreMonthly(rows, metricKey, storeName, labelKey) {
    const filtered = rows.filter(r => r[labelKey] === storeName);
    const buckets = {};
    filtered.forEach(r => {
      const monthRaw = r["produce_month"];
      let key = "기타";
      if (typeof monthRaw === "number") key = new Date(monthRaw).toISOString().slice(0, 7);
      buckets[key] = (buckets[key] || 0) + (Number(r[metricKey]) || 0);
    });
    return Object.keys(buckets).sort().map(k => ({ label: k, value: buckets[k] }));
  }

  function renderStoreChartAndTable() {
    const storeMetric = METRICS_DATA[STORE_KEY];
    const selectEl = document.getElementById("store-select");
    const selected = selectEl ? selectEl.value : "__all__";
    const { data, metric_key, label_key, monthly_totals } = storeMetric;

    const ctxEl = document.getElementById("storeBarChart");
    if (storeChartInstance) { storeChartInstance.destroy(); storeChartInstance = null; }

    const hasHistory = monthly_totals && Object.keys(monthly_totals).length > 0;
    const allMonths = hasHistory ? getSortedMonths(monthly_totals) : [];
    const activeMonths = hasHistory ? filterMonthsByPeriod(allMonths, storePeriod) : [];

    if (selected === "__all__") {
      const sorted = hasHistory
        ? aggregateStoreTotalsFromHistory(monthly_totals, activeMonths).slice(0, 15)
        : computeStoreTotals(data, metric_key, label_key).slice(0, 15);

      storeChartInstance = new Chart(ctxEl, {
        type: "bar",
        data: {
          labels: sorted.map(([name]) => name),
          datasets: [{ data: sorted.map(([, v]) => v), backgroundColor: "#a8562a", borderRadius: 4, maxBarThickness: 20 }],
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            datalabels: {
              anchor: "end", align: "right",
              font: { size: 10.5, family: "'IBM Plex Mono', monospace", weight: 600 },
              color: "#374151",
              formatter: (v) => v.toLocaleString("ko-KR"),
            },
          },
          scales: {
            x: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },
            y: { grid: { display: false }, ticks: { color: "#374151", font: { size: 12 } } },
          },
        },
      });

      const allSorted = hasHistory
        ? aggregateStoreTotalsFromHistory(monthly_totals, activeMonths)
        : computeStoreTotals(data, metric_key, label_key);
      const rows = allSorted.map(([name, val], i) => `
        <tr>
          <td class="rank-num">${String(i + 1).padStart(2, "0")}</td>
          <td>${name}</td>
          <td class="rank-val">${fmt(val)}</td>
        </tr>`).join("");
      document.getElementById("rank-table-area").innerHTML = `
        <table class="rank-table">
          <thead><tr><th>순위</th><th>매장</th><th style="text-align:right">건수</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    } else {
      const monthly = hasHistory
        ? storeMonthlySeriesFromHistory(monthly_totals, activeMonths, selected)
        : computeStoreMonthly(data, metric_key, selected, label_key);
      const total = monthly.reduce((a, p) => a + p.value, 0);
      const allSorted = hasHistory
        ? aggregateStoreTotalsFromHistory(monthly_totals, activeMonths)
        : computeStoreTotals(data, metric_key, label_key);
      const rank = allSorted.findIndex(([name]) => name === selected) + 1;

      storeChartInstance = new Chart(ctxEl, {
        type: "bar",
        data: {
          labels: monthly.map(p => p.label),
          datasets: [{ data: monthly.map(p => p.value), backgroundColor: "#a8562a", borderRadius: 5, maxBarThickness: 50 }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            datalabels: {
              anchor: "end", align: "top",
              font: { size: 11, family: "'IBM Plex Mono', monospace", weight: 600 },
              color: "#374151",
              formatter: (v) => v.toLocaleString("ko-KR"),
            },
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: "#9ca3af", font: { size: 11 } } },
            y: { grid: { color: "#f0f1f3" }, ticks: { color: "#9ca3af", font: { size: 11 } } },
          },
        },
      });

      document.getElementById("rank-table-area").innerHTML = `
        <div class="store-stats-row">
          <div class="store-stat"><div class="label">기간 내 순위</div><div class="value">${rank || "-"}위</div></div>
          <div class="store-stat"><div class="label">기간 내 누적</div><div class="value">${fmt(total)}</div></div>
        </div>
        <table class="rank-table">
          <thead><tr><th>월</th><th style="text-align:right">건수</th></tr></thead>
          <tbody>${monthly.map(p => `<tr><td>${p.label}</td><td class="rank-val">${fmt(p.value)}</td></tr>`).join("")}</tbody>
        </table>`;
    }
  }

  function renderPartnerTab() {
    const area = document.getElementById("partner-area");
    const storeMetric = METRICS_DATA[STORE_KEY];
    const hasStoreData = storeMetric && storeMetric.data && storeMetric.data.length;

    if (!hasStoreData) {
      area.innerHTML = `<div class="placeholder-panel"><div class="icon">🏬</div><h3>제휴처 데이터 없음</h3><p>매장별 데이터가 아직 없습니다.</p></div>`;
      return;
    }

    area.innerHTML = `
      <div class="two-col">
        <div class="section-card">
          <div class="section-head">
            <h2>제휴처 순위 / 추이</h2>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <div class="segmented" id="store-period-toggle">
                <button data-period="1m">1개월</button>
                <button data-period="3m">3개월</button>
                <button data-period="6m">6개월</button>
                <button class="active" data-period="all">전체</button>
              </div>
              <select class="store-select" id="store-select"><option>매장 불러오는 중...</option></select>
            </div>
          </div>
          <div class="bar-chart-wrap tall"><canvas id="storeBarChart"></canvas></div>
        </div>
        <div class="section-card">
          <div class="section-head"><h2>상세</h2></div>
          <div id="rank-table-area"></div>
        </div>
      </div>`;

    document.querySelectorAll("#store-period-toggle button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#store-period-toggle button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        storePeriod = btn.dataset.period;
        renderStoreChartAndTable();
      });
    });

    const { metric_key, label_key, data, monthly_totals } = storeMetric;
    const selectEl = document.getElementById("store-select");
    const hasHistory = monthly_totals && Object.keys(monthly_totals).length > 0;
    const sorted = hasHistory
      ? aggregateStoreTotalsFromHistory(monthly_totals, getSortedMonths(monthly_totals))
      : computeStoreTotals(data, metric_key, label_key);
    selectEl.innerHTML = `<option value="__all__">전체 제휴처 (TOP 15)</option>` +
      sorted.map(([name]) => `<option value="${name}">${name}</option>`).join("");
    selectEl.addEventListener("change", renderStoreChartAndTable);
    renderStoreChartAndTable();
  }

  /* ================= 공통 ================= */

  function setupTabs() {
    document.querySelectorAll("#tab-nav button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#tab-nav button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
      });
    });
  }

  async function load() {
    try {
      const res = await fetch("./data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("data.json을 불러오지 못했습니다");
      const data = await res.json();
      METRICS_DATA = data.metrics || {};

      setupTabs();
      renderDailyTab();
      renderMonthlyTab();
      renderPartnerTab();

      document.getElementById("updated-at").textContent = data.updated_at || "-";
    } catch (e) {
      document.getElementById("daily-area").innerHTML = `<div class="error">데이터를 불러오지 못했습니다.<br>${e.message}</div>`;
      document.getElementById("updated-at").textContent = "오류";
    }
  }

  load();
</script>
</body>
</html>
